<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Project OS · 多页面视觉预览</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030504;
        --surface: rgba(18, 22, 20, 0.74);
        --surface-raised: rgba(28, 33, 30, 0.82);
        --line: rgba(226, 240, 233, 0.16);
        --line-bright: rgba(245, 255, 250, 0.34);
        --text: #f3f7f4;
        --muted: #8d9791;
        --green: #37f58a;
        --green-deep: #10b965;
        --red: #ff5c61;
        --amber: #ffb45c;
        --radius-panel: 20px;
        --radius-card: 14px;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.52);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 78% 8%, rgba(55, 245, 138, 0.08), transparent 28rem),
          linear-gradient(145deg, #020403 0%, #070b09 50%, #030504 100%);
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      .skip-link {
        position: fixed;
        z-index: 100;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border: 1px solid var(--green);
        border-radius: 10px;
        color: var(--text);
        background: #0b110e;
        transform: translateY(-160%);
        transition: transform 160ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .ambient {
        position: fixed;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, black, transparent 92%);
      }

      .app-shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side-rail {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        width: 220px;
        height: 100vh;
        padding: 24px 16px 16px;
        border-right: 1px solid var(--line);
        background: rgba(4, 7, 5, 0.8);
        box-shadow: 16px 0 42px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(24px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 42px;
        padding: 0 8px 20px;
      }

      .brand-mark {
        position: relative;
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(55, 245, 138, 0.48);
        border-radius: 11px;
        color: var(--green);
        background: linear-gradient(145deg, rgba(55, 245, 138, 0.14), rgba(10, 15, 12, 0.82));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.18), 0 0 20px rgba(55, 245, 138, 0.12);
        font-size: 17px;
        font-weight: 750;
      }

      .brand-copy strong,
      .brand-copy span {
        display: block;
      }

      .brand-copy strong {
        letter-spacing: 0.02em;
      }

      .brand-copy span {
        margin-top: 1px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .rail-scroll {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .nav-group + .nav-group {
        margin-top: 17px;
      }

      .nav-label {
        margin: 0 9px 7px;
        color: #68716c;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .nav-list {
        display: grid;
        gap: 3px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-link {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 8px 10px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 11px;
        color: #9ca6a0;
        text-decoration: none;
        transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .nav-link::after {
        position: absolute;
        top: 10px;
        right: -1px;
        bottom: 10px;
        width: 2px;
        border-radius: 2px;
        background: var(--green);
        box-shadow: 0 0 12px var(--green);
        content: "";
        opacity: 0;
      }

      .nav-link:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.035);
      }

      .nav-link.is-active {
        border-color: rgba(55, 245, 138, 0.16);
        color: var(--text);
        background: linear-gradient(90deg, rgba(55, 245, 138, 0.11), rgba(255, 255, 255, 0.025));
      }

      .nav-link.is-active::after {
        opacity: 1;
      }

      .nav-icon {
        width: 18px;
        color: currentColor;
        text-align: center;
        font-size: 12px;
      }

      .rail-footer {
        display: grid;
        gap: 8px;
        padding-top: 12px;
      }

      .workspace-card,
      .user-card {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.026);
      }

      .workspace-card::before,
      .user-avatar {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 9px;
        color: var(--green);
        background: rgba(55, 245, 138, 0.1);
      }

      .workspace-card::before {
        content: "⌁";
      }

      .user-avatar {
        border-radius: 50%;
        color: var(--text);
        background: linear-gradient(145deg, #37423c, #171d19);
        font-size: 11px;
        font-weight: 700;
      }

      .rail-card-copy {
        min-width: 0;
      }

      .rail-card-copy span,
      .rail-card-copy strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rail-card-copy span {
        color: var(--muted);
        font-size: 10px;
      }

      .rail-card-copy strong {
        margin-top: 1px;
        font-size: 11px;
        font-weight: 650;
      }

      .page-main {
        min-width: 0;
        padding: 26px clamp(20px, 3.2vw, 48px) 44px;
      }

      [data-page-root] {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .page-view {
        animation: page-in 260ms ease both;
      }

      @keyframes page-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 22px;
      }

      .page-kicker {
        margin: 0 0 6px;
        color: var(--green);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .page-header h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 42px);
        font-weight: 680;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .page-description {
        max-width: 640px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .primary-action,
      .secondary-action {
        min-height: 38px;
        padding: 8px 14px;
        border-radius: 11px;
        cursor: pointer;
      }

      .primary-action {
        border: 1px solid rgba(55, 245, 138, 0.52);
        color: var(--text);
        background: linear-gradient(145deg, rgba(30, 44, 36, 0.94), rgba(8, 13, 10, 0.94));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.13), 0 0 22px rgba(55, 245, 138, 0.09);
        font-weight: 650;
      }

      .secondary-action {
        border: 1px solid var(--line);
        color: #cbd3ce;
        background: rgba(255, 255, 255, 0.035);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
        margin-bottom: 14px;
      }

      .metric-card,
      .glass-panel,
      .context-panel,
      .signature-stage {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, rgba(28, 33, 30, 0.72), var(--surface));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.075), var(--shadow);
        backdrop-filter: blur(22px);
      }

      .metric-card::before,
      .glass-panel::before,
      .context-panel::before,
      .signature-stage::before {
        position: absolute;
        top: 0;
        right: 12%;
        left: 12%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--line-bright), transparent);
        content: "";
        opacity: 0.64;
      }

      .metric-card {
        min-height: 98px;
        padding: 16px;
        border-radius: var(--radius-card);
      }

      .metric-label {
        color: var(--muted);
        font-size: 11px;
      }

      .metric-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }

      .metric-value {
        font-size: 25px;
        font-weight: 680;
        letter-spacing: -0.04em;
      }

      .metric-trend {
        color: var(--green);
        font-size: 10px;
      }

      .glass-panel {
        padding: 19px;
        border-radius: var(--radius-panel);
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
      }

      .panel-heading h2,
      .context-panel h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      .panel-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
      }

      .segmented {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.2);
      }

      .segmented button {
        min-height: 27px;
        padding: 4px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 10px;
      }

      .segmented button[aria-pressed="true"] {
        color: var(--text);
        background: rgba(55, 245, 138, 0.11);
        box-shadow: inset 0 0 0 1px rgba(55, 245, 138, 0.2);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 22px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #b7c0ba;
        background: rgba(255, 255, 255, 0.034);
        font-size: 10px;
        white-space: nowrap;
      }

      .status-badge::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
        box-shadow: 0 0 7px currentColor;
      }

      .status-badge.is-live {
        border-color: rgba(55, 245, 138, 0.22);
        color: var(--green);
      }

      .status-badge.is-attention {
        border-color: rgba(255, 180, 92, 0.24);
        color: var(--amber);
      }

      .status-badge.is-risk {
        border-color: rgba(255, 92, 97, 0.28);
        color: var(--red);
      }

      .content-frame {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(245px, 0.72fr);
        gap: 14px;
        margin-top: 14px;
      }

      .context-panel {
        min-width: 0;
        padding: 19px;
        border-radius: var(--radius-panel);
      }

      .context-list {
        display: grid;
        gap: 0;
        margin: 13px 0 0;
      }

      .context-list div {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(226, 240, 233, 0.09);
      }

      .context-list dt {
        color: var(--muted);
      }

      .context-list dd {
        margin: 0;
        text-align: right;
      }

      .signature-stage {
        min-height: 310px;
        padding: 20px;
        border-color: rgba(226, 240, 233, 0.2);
        border-radius: var(--radius-panel);
        background:
          radial-gradient(circle at 74% 16%, rgba(55, 245, 138, 0.1), transparent 15rem),
          linear-gradient(148deg, rgba(32, 38, 34, 0.78), rgba(9, 13, 11, 0.88));
      }

      .signature-stage::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(255, 255, 255, 0.023) 1px, transparent 1px);
        background-size: 100% 42px;
        content: "";
        mask-image: linear-gradient(90deg, transparent, black 18%, black 82%, transparent);
      }

      .signature-heading {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .signature-heading h2 {
        margin: 0;
        font-size: 14px;
      }

      .signature-heading span {
        color: var(--muted);
        font-size: 10px;
      }

      .signature-visual {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(5, minmax(98px, 1fr));
        align-items: end;
        gap: 10px;
        min-width: 570px;
        min-height: 224px;
        padding: 28px 4px 4px;
      }

      .visual-item {
        position: relative;
        min-height: calc(72px + var(--level, 1) * 16px);
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.08), 0 15px 28px rgba(0, 0, 0, 0.22);
      }

      .visual-item::before {
        display: block;
        width: 6px;
        height: 6px;
        margin-bottom: 26px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 13px rgba(55, 245, 138, 0.72);
        content: "";
      }

      .visual-item.is-amber::before {
        background: var(--amber);
        box-shadow: 0 0 13px rgba(255, 180, 92, 0.5);
      }

      .visual-item.is-red::before {
        background: var(--red);
        box-shadow: 0 0 13px rgba(255, 92, 97, 0.52);
      }

      .visual-item strong,
      .visual-item span {
        display: block;
      }

      .visual-item strong {
        font-size: 11px;
        font-weight: 650;
      }

      .visual-item span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }

      .stage-scroll {
        overflow-x: auto;
        scrollbar-color: rgba(55, 245, 138, 0.34) transparent;
        scrollbar-width: thin;
      }

      .empty-state {
        display: grid;
        min-height: 168px;
        padding: 20px;
        place-items: center;
        border: 1px dashed rgba(226, 240, 233, 0.2);
        border-radius: var(--radius-card);
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
      }

      .overview-shell {
        min-width: 0;
      }

      .overview-shell .metric-grid {
        margin-bottom: 14px;
      }

      .dashboard-health-stage {
        min-height: 286px;
      }

      .health-trend-layout {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(300px, 0.86fr) minmax(420px, 1.14fr);
        gap: 24px;
        min-width: 0;
        padding-top: 20px;
      }

      .trend-summary {
        min-width: 0;
        padding: 16px;
        border: 1px solid rgba(226, 240, 233, 0.11);
        border-radius: var(--radius-card);
        background: rgba(0, 0, 0, 0.14);
      }

      .trend-summary-head,
      .project-card-head,
      .actor-node-head,
      .select-item-head,
      .feed-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .trend-summary-head strong {
        font-size: 13px;
      }

      .trend-summary-head span {
        color: var(--green);
        font-size: 10px;
      }

      .trend-bars {
        display: grid;
        grid-template-columns: repeat(7, minmax(24px, 1fr));
        align-items: end;
        gap: 8px;
        height: 145px;
        margin-top: 13px;
      }

      .trend-column {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 7px;
        height: 100%;
        min-width: 0;
        color: var(--muted);
        font-size: 9px;
        text-align: center;
      }

      .trend-bar-slot {
        position: relative;
        min-height: 0;
        border-bottom: 1px solid rgba(226, 240, 233, 0.15);
        background: linear-gradient(to top, rgba(255, 255, 255, 0.025), transparent);
      }

      .trend-bar {
        position: absolute;
        right: 18%;
        bottom: 0;
        left: 18%;
        height: var(--trend-level);
        min-height: 4px;
        border-radius: 7px 7px 2px 2px;
        background: linear-gradient(to top, rgba(16, 185, 101, 0.38), rgba(55, 245, 138, 0.9));
        box-shadow: 0 0 16px rgba(55, 245, 138, 0.12);
      }

      .trend-bar::before {
        position: absolute;
        top: -13px;
        right: 50%;
        color: #b9c3bd;
        content: attr(data-value);
        font-size: 8px;
        transform: translateX(50%);
      }

      .health-lanes {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .health-lane {
        display: grid;
        grid-template-columns: minmax(92px, 0.9fr) minmax(132px, 1.6fr) auto;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid rgba(226, 240, 233, 0.1);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.024);
      }

      .health-lane-name,
      .project-card strong,
      .actor-node strong,
      .select-item strong,
      .feed-row strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .health-lane-name {
        font-size: 10px;
      }

      .progress-rail {
        display: block;
        width: 100%;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }

      .progress-rail span {
        display: block;
        width: var(--progress);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green-deep), var(--green));
      }

      .is-attention .progress-rail span {
        background: linear-gradient(90deg, rgba(255, 180, 92, 0.46), var(--amber));
      }

      .is-critical .progress-rail span {
        background: linear-gradient(90deg, rgba(255, 92, 97, 0.5), var(--red));
      }

      .dashboard-detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.58fr) minmax(260px, 0.72fr);
        gap: 14px;
        margin-top: 14px;
      }

      .dashboard-ops-grid,
      .dashboard-feed-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        min-width: 0;
      }

      .dashboard-feed-grid {
        margin-top: 14px;
      }

      .dashboard-ops-grid .glass-panel,
      .dashboard-feed-grid .glass-panel {
        min-width: 0;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.075), 0 16px 38px rgba(0, 0, 0, 0.28);
      }

      .select-list,
      .compact-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .select-item {
        display: block;
        width: 100%;
        min-width: 0;
        padding: 10px 11px;
        border: 1px solid rgba(226, 240, 233, 0.11);
        border-radius: 11px;
        color: inherit;
        background: rgba(255, 255, 255, 0.022);
        cursor: pointer;
        text-align: left;
      }

      .select-item:hover,
      .select-item[aria-pressed="true"] {
        border-color: rgba(55, 245, 138, 0.28);
        background: rgba(55, 245, 138, 0.055);
      }

      .select-item.is-critical[aria-pressed="true"] {
        border-color: rgba(255, 92, 97, 0.34);
        background: rgba(255, 92, 97, 0.055);
      }

      .select-item-head strong {
        font-size: 11px;
      }

      .select-item-meta,
      .feed-row span {
        color: var(--muted);
        font-size: 9px;
      }

      .select-item-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 10px;
        margin-top: 5px;
      }

      .feed-row {

      function clampPercent(value) {
        const numericValue = Number(value)
        return Number.isFinite(numericValue)
          ? Math.min(100, Math.max(0, Math.round(numericValue)))
          : 0
      }

      function safeAverage(values) {
        const finiteValues = values.map(Number).filter(Number.isFinite)
        if (!finiteValues.length) return 0
        return Math.round(finiteValues.reduce((sum, value) => sum + value, 0) / finiteValues.length)
      }

      function resolveActorPosition(actorId, index = 0) {
        const configuredPosition = actorNodePositions[actorId]
        const hasValidCoordinates = Number.isFinite(Number(configuredPosition?.x))
          && Number.isFinite(Number(configuredPosition?.y))
        if (hasValidCoordinates) {
          return {
            x: clampPercent(configuredPosition.x),
            y: clampPercent(configuredPosition.y),
          }
        }

        const fallbackPositions = [
          { x: 18, y: 20 },
          { x: 50, y: 20 },
          { x: 82, y: 20 },
          { x: 26, y: 76 },
          { x: 58, y: 76 },
          { x: 86, y: 76 },
        ]
        return fallbackPositions[index % fallbackPositions.length]
      }

      function projectToneClass(project) {
        if (project.health === '高风险') return 'is-critical'
        if (project.health === '关注') return 'is-attention'
        return ''

        if (value === '高风险' || value === '危急') return 'is-risk'
        if (value === '关注' || value === '评审中') return 'is-attention'
        return 'is-live'
      }

      function projectMatchesFilter(project, filter) {
        if (filter === 'healthy') return project.health === '正常'
        if (filter === 'attention') return project.health === '关注'
        if (filter === 'risk') return project.health === '高风险'

              <span class="project-card-head"><strong title="${escapeHtml(project.name)}">${escapeHtml(project.name)}</strong><span class="status-badge ${statusBadgeTone(project.health)}">${escapeHtml(project.health)}</span></span>
              <span>
                <span class="progress-copy"><span>交付进度</span><strong>${safeProgress}%</strong></span>
                <span class="progress-rail" aria-hidden="true"><span style="--progress: ${safeProgress}%"></span></span>
              </span>
              <span class="project-card-meta">
                <span><span class="project-meta-label">负责人</span><span class="project-meta-value">${escapeHtml(project.owner)}</span></span>
                <span><span class="project-meta-label">开放风险</span><span class="project-meta-value">${escapeHtml(project.risk)} 项</span></span>
                <span><span class="project-meta-label">目标日期</span><span class="project-meta-value">${escapeHtml(project.due)}</span></span>
                <span><span class="project-meta-label">组合差异</span><span class="project-meta-value">${safeProgress - averageProgress >= 0 ? '+' : ''}${safeProgress - averageProgress}%</span></span>
              </span>
            </button>
          `
        }).join('')

        const selectedActivity = selectedProject
          ? activityRecords.find((activity) => activity.projectId === selectedProject.id)
          : null
        const selectedDeliverable = selectedProject
          ? deliverables.find((deliverable) => deliverable.projectId === selectedProject.id)
          : null
        const projectSummaryRows = selectedProject ? [
          ['负责人', selectedProject.owner],
          ['进度', `${clampPercent(selectedProject.progress)}%`],
          ['健康状态', selectedProject.health],
          ['开放风险', `${selectedProject.risk} 项`],
          ['目标日期', selectedProject.due],
          ['最近交付物', selectedDeliverable?.name || '暂无'],
        ] : []
        const projectSummaryMarkup = selectedProject ? `
          <section class="context-panel project-summary" aria-labelledby="project-summary-title">
            <div class="panel-heading"><h2 id="project-summary-title">${escapeHtml(selectedProject.name)}</h2><span class="status-badge ${statusBadgeTone(selectedProject.health)}">${escapeHtml(selectedProject.health)}</span></div>
            <dl class="context-list">${renderContextRows(projectSummaryRows)}</dl>
            <p class="summary-note">${escapeHtml(selectedActivity?.text || '暂无最近活动')}</p>
          </section>
        ` : `
          <section class="context-panel project-summary" aria-labelledby="project-summary-title">
            <h2 id="project-summary-title">项目摘要</h2>
            <div class="empty-state" data-project-summary-empty><div><strong>暂无可选项目</strong>调整筛选或创建项目后查看摘要。</div></div>
          </section>
        `

        return elementFromHTML(`
          <section class="page-view overview-shell" data-page="projects" aria-labelledby="projects-title">
            ${renderOverviewHeader('projects', '横向比较项目进度、负责人、目标日期与风险暴露', '新建项目')}
            <div class="metric-grid" aria-label="项目组合关键指标">${renderMetricCards(metrics)}</div>
            <div class="portfolio-layout">
              <section class="signature-stage portfolio-stage" aria-labelledby="projects-signature-title">
                <div class="signature-heading">
                  <div><h2 id="projects-signature-title">玻璃项目矩阵</h2><span>${visibleProjects.length} / ${projects.length} 个项目</span></div>
                  <div class="segmented" role="group" aria-label="项目健康筛选">${filters}</div>
                </div>
                <div class="project-matrix-scroll" tabindex="0" aria-label="项目矩阵，可在窄屏横向滚动">
                  <div class="project-matrix">${cards || '<div class="empty-state" data-project-empty><div><strong>没有匹配项目</strong>请切换健康筛选。</div></div>'}</div>
                </div>
              </section>
              ${projectSummaryMarkup}
            </div>
          </section>
        `)
      }

      function renderProjectDetail() {
        return renderPageShell('project-detail')
      }

      function renderActors() {
        const filterOptions = [
          ['all', '全部'],
          ['human', '人类'],
          ['agent', 'Agent'],
        ]
        const visibleActors = actors.filter((actor) => previewState.actorFilter === 'all' || actor.type === previewState.actorFilter)
        if (!visibleActors.some((actor) => actor.id === previewState.selectedActorId)) {
          previewState.selectedActorId = visibleActors[0]?.id ?? null
        }
        const visibleActorIds = new Set(visibleActors.map((actor) => actor.id))
        const selectedActor = visibleActors.find((actor) => actor.id === previewState.selectedActorId) ?? null
        const activeActors = actors.filter((actor) => actor.status !== '待命')
        const averageLoad = safeAverage(actors.map((actor) => actor.load))
        const metrics = [
          ['协作者', String(actors.length).padStart(2, '0'), `${actors.filter((actor) => actor.type === 'human').length} 人 / ${actors.filter((actor) => actor.type === 'agent').length} Agent`],
          ['活跃中', String(activeActors.length).padStart(2, '0'), '实时状态'],
          ['平均负载', `${averageLoad}%`, '可调度'],
          ['待命节点', String(actors.length - activeActors.length).padStart(2, '0'), '可接力'],
        ]

        const filters = filterOptions.map(([value, label]) => `
          <button type="button" data-actor-filter="${escapeHtml(value)}" aria-pressed="${previewState.actorFilter === value}">${escapeHtml(label)}</button>
        `).join('')

        const positionByActorId = new Map(visibleActors.map((actor, index) => [
          actor.id,
          resolveActorPosition(actor.id, index),
        ]))
        const validConnections = actorConnections.filter((connection) => {
          if (!connection || typeof connection.from !== 'string' || typeof connection.to !== 'string') return false
          return visibleActorIds.has(connection.from)
            && visibleActorIds.has(connection.to)
            && positionByActorId.has(connection.from)
            && positionByActorId.has(connection.to)
        })
        const connectors = validConnections.map((connection) => {
          const from = positionByActorId.get(connection.from)
          const to = positionByActorId.get(connection.to)
          return `<line class="${connection.primary ? 'is-primary' : ''}" x1="${clampPercent(from.x)}" y1="${clampPercent(from.y)}" x2="${clampPercent(to.x)}" y2="${clampPercent(to.y)}"></line>`
        }).join('')

        const nodes = visibleActors.map((actor) => {
          const position = positionByActorId.get(actor.id)
          const safeLoad = clampPercent(actor.load)
          return `
            <button class="actor-node" type="button" data-actor-id="${escapeHtml(actor.id)}" aria-pressed="${selectedActor?.id === actor.id}"
              style="--node-x: ${clampPercent(position.x)}%; --node-y: ${clampPercent(position.y)}%" aria-label="查看 ${escapeHtml(actor.name)} 协作摘要">
              <span class="actor-node-head"><strong title="${escapeHtml(actor.name)}">${escapeHtml(actor.name)}</strong><span class="status-badge ${actor.status === '待命' ? '' : 'is-live'}">${escapeHtml(actor.status)}</span></span>
              <small>${actor.type === 'human' ? '人类' : 'Agent'} · ${safeLoad}% 负载</small>
              <span class="progress-rail" aria-hidden="true"><span style="--progress: ${safeLoad}%"></span></span>
            </button>
          `
        }).join('')

        const connectionDescriptions = validConnections.map((connection) => {
          const fromActor = visibleActors.find((actor) => actor.id === connection.from)
          const toActor = visibleActors.find((actor) => actor.id === connection.to)
          return `<li>${escapeHtml(fromActor?.name || connection.from)} 到 ${escapeHtml(toActor?.name || connection.to)}：${connection.primary ? '主要协作' : '辅助协作'}</li>`
        }).join('')
        const actorProjects = selectedActor
          ? projects.filter((project) => project.owner === selectedActor.name)
          : []
        const recentActivity = selectedActor
          ? activityRecords.find((activity) => activity.actorId === selectedActor.id)
          : null
        const actorSummaryRows = selectedActor ? [
          ['身份', selectedActor.type === 'human' ? '人类' : 'Agent'],
          ['当前状态', selectedActor.status],
          ['工作负载', `${clampPercent(selectedActor.load)}%`],
          ['参与项目', actorProjects.map((project) => project.name).join('、') || '暂无'],
        ] : []
        const selectedSkills = Array.isArray(selectedActor?.skills) ? selectedActor.skills : []
        const skillMarkup = selectedSkills.map((skill) => `<span class="skill-chip">${escapeHtml(skill)}</span>`).join('')
        const actorSummaryMarkup = selectedActor ? `
          <section class="context-panel actor-summary" aria-labelledby="actor-summary-title">
            <div class="panel-heading"><h2 id="actor-summary-title">${escapeHtml(selectedActor.name)}</h2><span class="status-badge ${selectedActor.status === '待命' ? '' : 'is-live'}">${escapeHtml(selectedActor.status)}</span></div>
            <dl class="context-list">${renderContextRows(actorSummaryRows)}</dl>
            <div class="skill-chips" aria-label="技能">${skillMarkup || '<span class="skill-chip">暂无技能</span>'}</div>
            <p class="summary-note">最近活动：${escapeHtml(recentActivity?.text || '暂无')}</p>
          </section>
        ` : `
          <section class="context-panel actor-summary" aria-labelledby="actor-summary-title">
            <h2 id="actor-summary-title">协作者摘要</h2>
            <div class="empty-state" data-actor-summary-empty><div><strong>暂无可选协作者</strong>调整筛选或邀请协作者后查看摘要。</div></div>
          </section>
        `

        return elementFromHTML(`
          <section class="page-view overview-shell" data-page="actors" aria-labelledby="actors-title">
            ${renderOverviewHeader('actors', '观察人类与 Agent 的负载、技能和协作关系', '邀请协作者')}
            <div class="metric-grid" aria-label="协作者网络关键指标">${renderMetricCards(metrics)}</div>
            <div class="actor-layout">
              <section class="signature-stage actor-network-stage" aria-labelledby="actors-signature-title">
                <div class="signature-heading">
                  <div><h2 id="actors-signature-title">协作网络</h2><span>${visibleActors.length} 个节点 · ${validConnections.length} 条连接</span></div>
                  <div class="segmented" role="group" aria-label="协作者类型筛选">${filters}</div>
                </div>
                <div class="network-scroll" tabindex="0" aria-label="协作者关系图，可在窄屏横向滚动" aria-describedby="actor-connections-description">
                  <div class="actor-network-canvas">
                    <svg class="network-connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${connectors}</svg>
                    ${nodes || '<div class="empty-state" data-actor-empty><div><strong>没有匹配协作者</strong>请切换类型筛选。</div></div>'}
                  </div>
                </div>
                <div class="sr-only" id="actor-connections-description">
                  <p>当前协作连接关系：</p>
                  ${connectionDescriptions ? `<ul>${connectionDescriptions}</ul>` : '<p>当前筛选下无协作连接。</p>'}
                </div>
              </section>
              ${actorSummaryMarkup}
            </div>
          </section>
        `)
      }

      function renderTasks() {
        return renderPageShell('tasks')
      }

      function renderGantt() {
        return renderPageShell('gantt')
      }

      function renderRequirements() {
        return renderPageShell('requirements')
      }

      function renderDefects() {
        return renderPageShell('defects')
      }

      function renderSettings() {
        return renderPageShell('settings')
      }

      function assertRouteRegistry() {
        const expectedRoutes = new Set(routeOrder)
        if (expectedRoutes.size !== routeOrder.length) {
          throw new Error('Route registry mismatch: routeOrder contains duplicates')
        }

        const routeRegistries = {
          pageTitles: Object.keys(pageTitles),
          pageRenderers: Object.keys(pageRenderers),
          pageShells: Object.keys(pageShells),
          navigation: Array.from(document.querySelectorAll('[data-route]'), (link) => link.dataset.route),
        }

        Object.entries(routeRegistries).forEach(([name, routes]) => {
          const actualRoutes = new Set(routes)
          const matches = routes.length === routeOrder.length
            && actualRoutes.size === expectedRoutes.size
            && routeOrder.every((route) => actualRoutes.has(route))

          if (!matches) throw new Error(`Route registry mismatch: ${name}`)
        })
      }

      function currentRoute() {
        const candidate = location.hash.replace(/^#\/?/, '')
        return routeOrder.includes(candidate) ? candidate : 'dashboard'
      }

      function canonicalizeRouteHash(route) {
        const canonicalHash = `#${route}`
        if (location.hash !== canonicalHash) history.replaceState(null, '', canonicalHash)
      }

      function renderCurrentPage({ focusHeading = false } = {}) {
        const route = currentRoute()
        canonicalizeRouteHash(route)

        document.querySelectorAll('[data-route]').forEach((link) => {
          const active = link.dataset.route === route
          link.classList.toggle('is-active', active)
          active ? link.setAttribute('aria-current', 'page') : link.removeAttribute('aria-current')
        })

        pageRoot.replaceChildren(pageRenderers[route]())
        document.title = `Project OS · ${pageTitles[route]}`

        if (focusHeading) pageRoot.querySelector('h1')?.focus()
      }

      function showToast(message) {
        clearTimeout(toastTimer)
        clearTimeout(selectionStatusTimer)
        selectionStatus.textContent = ''
        selectionStatusTimer = window.setTimeout(() => {
          selectionStatus.textContent = message
          selectionStatusTimer = 0
        }, 0)
        toast.textContent = message
        toast.classList.add('is-visible')
        toastTimer = window.setTimeout(() => {
          toast.classList.remove('is-visible')
          toastTimer = 0
        }, 1900)
      }

      function announceSelection(message) {
        showToast(message)
      }

      skipLink.addEventListener('click', (event) => {
        event.preventDefault()
        mainContent.focus()
      })

      function rerenderCurrentPageAndRestoreFocus(attribute, value) {
        renderCurrentPage()
        const target = Array.from(pageRoot.querySelectorAll(`[${attribute}]`))
          .find((element) => element.getAttribute(attribute) === value)
        target?.focus()
      }

      document.addEventListener('click', (event) => {
        const dashboardSelection = event.target.closest('[data-dashboard-select]')
        if (dashboardSelection) {
          const selection = dashboardSelection.dataset.dashboardSelect
          const isKnownRisk = riskQueue.some((risk) => risk.id === selection)
          const isKnownActor = actors.some((actor) => actor.id === selection)
          if (isKnownRisk || isKnownActor) {
            previewState.dashboardSelection = selection
            rerenderCurrentPageAndRestoreFocus('data-dashboard-select', selection)
            const selectedRisk = riskQueue.find((risk) => risk.id === selection)
            const selectedActor = actors.find((actor) => actor.id === selection)
            announceSelection(selectedRisk
              ? `已选择风险：${selectedRisk.title}`
              : `已选择协作者：${selectedActor.name}`)
          }
          return
        }

        const projectFilter = event.target.closest('[data-project-filter]')
        if (projectFilter) {
          const filter = projectFilter.dataset.projectFilter
          if (projectFilterValues.has(filter)) {
            previewState.projectFilter = filter
            const visibleProjects = projects.filter((project) => projectMatchesFilter(project, filter))
            if (!visibleProjects.some((project) => project.id === previewState.selectedProjectId)) {
              previewState.selectedProjectId = visibleProjects[0]?.id ?? null
            }
            rerenderCurrentPageAndRestoreFocus('data-project-filter', filter)
            announceSelection(`项目筛选：${projectFilterLabels.get(filter)}，${visibleProjects.length ? `${visibleProjects.length} 个项目` : '无匹配项目'}`)
          }
          return
        }

        const projectSelection = event.target.closest('[data-project-id]')
        if (projectSelection) {
          const projectId = projectSelection.dataset.projectId
          const project = projects.find((item) => item.id === projectId)
          if (project && projectMatchesFilter(project, previewState.projectFilter)) {
            previewState.selectedProjectId = projectId
            rerenderCurrentPageAndRestoreFocus('data-project-id', projectId)
            announceSelection(`已选择项目：${project.name}`)
          }
          return
        }

        const actorFilter = event.target.closest('[data-actor-filter]')
        if (actorFilter) {
          const filter = actorFilter.dataset.actorFilter
          if (actorFilterValues.has(filter)) {
            previewState.actorFilter = filter
            const visibleActors = actors.filter((actor) => filter === 'all' || actor.type === filter)
            if (!visibleActors.some((actor) => actor.id === previewState.selectedActorId)) {
              previewState.selectedActorId = visibleActors[0]?.id ?? null
            }
            rerenderCurrentPageAndRestoreFocus('data-actor-filter', filter)
            announceSelection(`协作者筛选：${actorFilterLabels.get(filter)}，${visibleActors.length ? `${visibleActors.length} 位协作者` : '无匹配协作者'}`)
          }
          return
        }

        const actorSelection = event.target.closest('[data-actor-id]')
        if (actorSelection) {
          const actorId = actorSelection.dataset.actorId
          const actor = actors.find((item) => item.id === actorId)
          if (actor && (previewState.actorFilter === 'all' || actor.type === previewState.actorFilter)) {
            previewState.selectedActorId = actorId
            rerenderCurrentPageAndRestoreFocus('data-actor-id', actorId)
            announceSelection(`已选择协作者：${actor.name}`)
          }
          return
        }

        const action = event.target.closest('[data-prototype-action]')
        if (action) showToast(`${action.dataset.prototypeAction}：预览模式，未写入数据`)
      })

      window.addEventListener('hashchange', () => renderCurrentPage({ focusHeading: true }))

      assertRouteRegistry()
      if (!location.hash) history.replaceState(null, '', '#dashboard')
      renderCurrentPage()
    </script>
  </body>
</html>
