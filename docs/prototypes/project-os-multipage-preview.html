<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Project OS · 多页面视觉预览</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030504;
        --surface: rgba(18, 22, 20, 0.74);
        --surface-raised: rgba(28, 33, 30, 0.82);
        --line: rgba(226, 240, 233, 0.16);
        --line-bright: rgba(245, 255, 250, 0.34);
        --text: #f3f7f4;
        --muted: #8d9791;
        --green: #37f58a;
        --green-deep: #10b965;
        --red: #ff5c61;
        --amber: #ffb45c;
        --radius-panel: 20px;
        --radius-card: 14px;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.52);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 78% 8%, rgba(55, 245, 138, 0.08), transparent 28rem),
          linear-gradient(145deg, #020403 0%, #070b09 50%, #030504 100%);
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      .skip-link {
        position: fixed;
        z-index: 100;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border: 1px solid var(--green);
        border-radius: 10px;
        color: var(--text);
        background: #0b110e;
        transform: translateY(-160%);
        transition: transform 160ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .ambient {
        position: fixed;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, black, transparent 92%);
      }

      .app-shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side-rail {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        width: 220px;
        height: 100vh;
        padding: 24px 16px 16px;
        border-right: 1px solid var(--line);
        background: rgba(4, 7, 5, 0.8);
        box-shadow: 16px 0 42px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(24px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 42px;
        padding: 0 8px 20px;
      }

      .brand-mark {
        position: relative;
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(55, 245, 138, 0.48);
        border-radius: 11px;
        color: var(--green);
        background: linear-gradient(145deg, rgba(55, 245, 138, 0.14), rgba(10, 15, 12, 0.82));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.18), 0 0 20px rgba(55, 245, 138, 0.12);
        font-size: 17px;
        font-weight: 750;
      }

      .brand-copy strong,
      .brand-copy span {
        display: block;
      }

      .brand-copy strong {
        letter-spacing: 0.02em;
      }

      .brand-copy span {
        margin-top: 1px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .rail-scroll {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .nav-group + .nav-group {
        margin-top: 17px;
      }

      .nav-label {
        margin: 0 9px 7px;
        color: #68716c;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .nav-list {
        display: grid;
        gap: 3px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-link {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 8px 10px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 11px;
        color: #9ca6a0;
        text-decoration: none;
        transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .nav-link::after {
        position: absolute;
        top: 10px;
        right: -1px;
        bottom: 10px;
        width: 2px;
        border-radius: 2px;
        background: var(--green);
        box-shadow: 0 0 12px var(--green);
        content: "";
        opacity: 0;
      }

      .nav-link:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.035);
      }

      .nav-link.is-active {
        border-color: rgba(55, 245, 138, 0.16);
        color: var(--text);
        background: linear-gradient(90deg, rgba(55, 245, 138, 0.11), rgba(255, 255, 255, 0.025));
      }

      .nav-link.is-active::after {
        opacity: 1;
      }

      .nav-icon {
        width: 18px;
        color: currentColor;
        text-align: center;
        font-size: 12px;
      }

      .rail-footer {
        display: grid;
        gap: 8px;
        padding-top: 12px;
      }

      .workspace-card,
      .user-card {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.026);
      }

      .workspace-card::before,
      .user-avatar {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 9px;
        color: var(--green);
        background: rgba(55, 245, 138, 0.1);
      }

      .workspace-card::before {
        content: "⌁";
      }

      .user-avatar {
        border-radius: 50%;
        color: var(--text);
        background: linear-gradient(145deg, #37423c, #171d19);
        font-size: 11px;
        font-weight: 700;
      }

      .rail-card-copy {
        min-width: 0;
      }

      .rail-card-copy span,
      .rail-card-copy strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rail-card-copy span {
        color: var(--muted);
        font-size: 10px;
      }

      .rail-card-copy strong {
        margin-top: 1px;
        font-size: 11px;
        font-weight: 650;
      }

      .page-main {
        min-width: 0;
        padding: 26px clamp(20px, 3.2vw, 48px) 44px;
      }

      [data-page-root] {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .page-view {
        animation: page-in 260ms ease both;
      }

      @keyframes page-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 22px;
      }

      .page-kicker {
        margin: 0 0 6px;
        color: var(--green);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .page-header h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 42px);
        font-weight: 680;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .page-description {
        max-width: 640px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .primary-action,
      .secondary-action {
        min-height: 38px;
        padding: 8px 14px;
        border-radius: 11px;
        cursor: pointer;
      }

      .primary-action {
        border: 1px solid rgba(55, 245, 138, 0.52);
        color: var(--text);
        background: linear-gradient(145deg, rgba(30, 44, 36, 0.94), rgba(8, 13, 10, 0.94));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.13), 0 0 22px rgba(55, 245, 138, 0.09);
        font-weight: 650;
      }

      .secondary-action {
        border: 1px solid var(--line);
        color: #cbd3ce;
        background: rgba(255, 255, 255, 0.035);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
        margin-bottom: 14px;
      }

      .metric-card,
      .glass-panel,
      .context-panel,
      .signature-stage {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, rgba(28, 33, 30, 0.72), var(--surface));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.075), var(--shadow);
        backdrop-filter: blur(22px);
      }

      .metric-card::before,
      .glass-panel::before,
      .context-panel::before,
      .signature-stage::before {
        position: absolute;
        top: 0;
        right: 12%;
        left: 12%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--line-bright), transparent);
        content: "";
        opacity: 0.64;
      }

      .metric-card {
        min-height: 98px;
        padding: 16px;
        border-radius: var(--radius-card);
      }

      .metric-label {
        color: var(--muted);
        font-size: 11px;
      }

      .metric-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }

      .metric-value {
        font-size: 25px;
        font-weight: 680;
        letter-spacing: -0.04em;
      }

      .metric-trend {
        color: var(--green);
        font-size: 10px;
      }

      .glass-panel {
        padding: 19px;
        border-radius: var(--radius-panel);
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
      }

      .panel-heading h2,
      .context-panel h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      .panel-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
      }

      .segmented {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.2);
      }

      .segmented button {
        min-height: 27px;
        padding: 4px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 10px;
      }

      .segmented button[aria-pressed="true"] {
        color: var(--text);
        background: rgba(55, 245, 138, 0.11);
        box-shadow: inset 0 0 0 1px rgba(55, 245, 138, 0.2);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 22px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #b7c0ba;
        background: rgba(255, 255, 255, 0.034);
        font-size: 10px;
        white-space: nowrap;
      }

      .status-badge::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
        box-shadow: 0 0 7px currentColor;
      }

      .status-badge.is-live {
        border-color: rgba(55, 245, 138, 0.22);
        color: var(--green);
      }

      .status-badge.is-attention {
        border-color: rgba(255, 180, 92, 0.24);
        color: var(--amber);
      }

      .status-badge.is-risk {
        border-color: rgba(255, 92, 97, 0.28);
        color: var(--red);
      }

      .content-frame {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(245px, 0.72fr);
        gap: 14px;
        margin-top: 14px;
      }

      .context-panel {
        min-width: 0;
        padding: 19px;
        border-radius: var(--radius-panel);
      }

      .context-list {
        display: grid;
        gap: 0;
        margin: 13px 0 0;
      }

      .context-list div {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(226, 240, 233, 0.09);
      }

      .context-list dt {
        color: var(--muted);
      }

      .context-list dd {
        margin: 0;
        text-align: right;
      }

      .signature-stage {
        min-height: 310px;
        padding: 20px;
        border-color: rgba(226, 240, 233, 0.2);
        border-radius: var(--radius-panel);
        background:
          radial-gradient(circle at 74% 16%, rgba(55, 245, 138, 0.1), transparent 15rem),
          linear-gradient(148deg, rgba(32, 38, 34, 0.78), rgba(9, 13, 11, 0.88));
      }

      .signature-stage::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(255, 255, 255, 0.023) 1px, transparent 1px);
        background-size: 100% 42px;
        content: "";
        mask-image: linear-gradient(90deg, transparent, black 18%, black 82%, transparent);
      }

      .signature-heading {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .signature-heading h2 {
        margin: 0;
        font-size: 14px;
      }

      .signature-heading span {
        color: var(--muted);
        font-size: 10px;
      }

      .signature-visual {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(5, minmax(98px, 1fr));
        align-items: end;
        gap: 10px;
        min-width: 570px;
        min-height: 224px;
        padding: 28px 4px 4px;
      }

      .visual-item {
        position: relative;
        min-height: calc(72px + var(--level, 1) * 16px);
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.08), 0 15px 28px rgba(0, 0, 0, 0.22);
      }

      .visual-item::before {
        display: block;
        width: 6px;
        height: 6px;
        margin-bottom: 26px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 13px rgba(55, 245, 138, 0.72);
        content: "";
      }

      .visual-item.is-amber::before {
        background: var(--amber);
        box-shadow: 0 0 13px rgba(255, 180, 92, 0.5);
      }

      .visual-item.is-red::before {
        background: var(--red);
        box-shadow: 0 0 13px rgba(255, 92, 97, 0.52);
      }

      .visual-item strong,
      .visual-item span {
        display: block;
      }

      .visual-item strong {
        font-size: 11px;
        font-weight: 650;
      }

      .visual-item span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }

      .stage-scroll {
        overflow-x: auto;
        scrollbar-color: rgba(55, 245, 138, 0.34) transparent;
        scrollbar-width: thin;
      }

      .empty-state {
        display: grid;
        min-height: 168px;
        padding: 20px;
        place-items: center;
        border: 1px dashed rgba(226, 240, 233, 0.2);
        border-radius: var(--radius-card);
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
      }

      .overview-shell {
        min-width: 0;
      }

      .overview-shell .metric-grid {
        margin-bottom: 14px;
      }

      .dashboard-health-stage {
        min-height: 286px;
      }

      .health-trend-layout {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(300px, 0.86fr) minmax(420px, 1.14fr);
        gap: 24px;
        min-width: 0;
        padding-top: 20px;
      }

      .trend-summary {
        min-width: 0;
        padding: 16px;
        border: 1px solid rgba(226, 240, 233, 0.11);
        border-radius: var(--radius-card);
        background: rgba(0, 0, 0, 0.14);
      }

      .trend-summary-head,
      .project-card-head,
      .actor-node-head,
      .select-item-head,
      .feed-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .trend-summary-head strong {
        font-size: 13px;
      }

      .trend-summary-head span {
        color: var(--green);
        font-size: 10px;
      }

      .trend-bars {
        display: grid;
        grid-template-columns: repeat(7, minmax(24px, 1fr));
        align-items: end;
        gap: 8px;
        height: 145px;
        margin-top: 13px;
      }

      .trend-column {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 7px;
        height: 100%;
        min-width: 0;
        color: var(--muted);
        font-size: 9px;
        text-align: center;
      }

      .trend-bar-slot {
        position: relative;
        min-height: 0;
        border-bottom: 1px solid rgba(226, 240, 233, 0.15);
        background: linear-gradient(to top, rgba(255, 255, 255, 0.025), transparent);
      }

      .trend-bar {
        position: absolute;
        right: 18%;
        bottom: 0;
        left: 18%;
        height: var(--trend-level);
        min-height: 4px;
        border-radius: 7px 7px 2px 2px;
        background: linear-gradient(to top, rgba(16, 185, 101, 0.38), rgba(55, 245, 138, 0.9));
        box-shadow: 0 0 16px rgba(55, 245, 138, 0.12);
      }

      .trend-bar::before {
        position: absolute;
        top: -13px;
        right: 50%;
        color: #b9c3bd;
        content: attr(data-value);
        font-size: 8px;
        transform: translateX(50%);
      }

      .health-lanes {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .health-lane {
        display: grid;
        grid-template-columns: minmax(92px, 0.9fr) minmax(132px, 1.6fr) auto;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid rgba(226, 240, 233, 0.1);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.024);
      }

      .health-lane-name,
      .project-card strong,
      .actor-node strong,
      .select-item strong,
      .feed-row strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .health-lane-name {
        font-size: 10px;
      }

      .progress-rail {
        display: block;
        width: 100%;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }

      .progress-rail span {
        display: block;
        width: var(--progress);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green-deep), var(--green));
      }

      .is-attention .progress-rail span {
        background: linear-gradient(90deg, rgba(255, 180, 92, 0.46), var(--amber));
      }

      .is-critical .progress-rail span {
        background: linear-gradient(90deg, rgba(255, 92, 97, 0.5), var(--red));
      }

      .dashboard-detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.58fr) minmax(260px, 0.72fr);
        gap: 14px;
        margin-top: 14px;
      }

      .dashboard-ops-grid,
      .dashboard-feed-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        min-width: 0;
      }

      .dashboard-feed-grid {
        margin-top: 14px;
      }

      .dashboard-ops-grid .glass-panel,
      .dashboard-feed-grid .glass-panel {
        min-width: 0;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.075), 0 16px 38px rgba(0, 0, 0, 0.28);
      }

      .select-list,
      .compact-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .select-item {
        display: block;
        width: 100%;
        min-width: 0;
        padding: 10px 11px;
        border: 1px solid rgba(226, 240, 233, 0.11);
        border-radius: 11px;
        color: inherit;
        background: rgba(255, 255, 255, 0.022);
        cursor: pointer;
        text-align: left;
      }

      .select-item:hover,
      .select-item[aria-pressed="true"] {
        border-color: rgba(55, 245, 138, 0.28);
        background: rgba(55, 245, 138, 0.055);
      }

      .select-item.is-critical[aria-pressed="true"] {
        border-color: rgba(255, 92, 97, 0.34);
        background: rgba(255, 92, 97, 0.055);
      }

      .select-item-head strong {
        font-size: 11px;
      }

      .select-item-meta,
      .feed-row span {
        color: var(--muted);
        font-size: 9px;
      }

      .select-item-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 10px;
        margin-top: 5px;
      }

      .feed-row {

        width: 160px;

        cursor: pointer;
        text-align: left;
        transform: translateY(var(--fan-lift)) scale(var(--fan-scale));
        transform-origin: 50% 88%;

        --fan-roll: -1.2deg;

        --fan-tilt: 3.5deg;
        --fan-roll: -0.7deg;

      .task-fan-card:nth-child(3) {
        --fan-tilt: 1.2deg;
        --fan-roll: -0.2deg;

        --fan-tilt: -1.2deg;
        --fan-roll: 0.2deg;

        --fan-tilt: -3.5deg;
        --fan-roll: 0.7deg;

          white-space: nowrap;

        .task-context {

        }

        .task-list-panel,

          min-height: auto;
        }
      }

      @media (max-width: 520px) {

          transform: none;
        }

        .network-connectors,
        .actor-node {
          animation: none !important;
          transition: none !important;
        }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => htmlEscapes[character])
      }

      function safeVisualTone(tone) {
        return visualToneClasses.has(tone) ? tone : ''
      }

      function clampVisualLevel(level) {
        const numericLevel = Number(level)
        return Number.isFinite(numericLevel)
          ? Math.min(5, Math.max(1, Math.round(numericLevel)))
          : 1
      }

      function elementFromHTML(markup) {
        const template = document.createElement('template')
        template.innerHTML = markup.trim()
        return template.content.firstElementChild
      }

            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-row">
              <strong class="metric-value">${escapeHtml(value)}</strong>
              <span class="metric-trend">${escapeHtml(trend)}</span>
            </div>
          </article>
        `).join('')
      }

      function renderVisualItems(items) {
        return items.map(([name, detail, level, tone]) => {
          const safeTone = safeVisualTone(tone)
          const safeLevel = clampVisualLevel(level)
          return `
            <div class="visual-item ${safeTone}" style="--level: ${safeLevel}">
              <strong>${escapeHtml(name)}</strong>
              <span>${escapeHtml(detail)}</span>
            </div>
          `
        }).join('')
      }

        return rows.map(([label, value]) => `

      function clampPercent(value) {
        const numericValue = Number(value)
        return Number.isFinite(numericValue)
          ? Math.min(100, Math.max(0, Math.round(numericValue)))
          : 0
      }

      function safeAverage(values) {
        const finiteValues = values.map(Number).filter(Number.isFinite)
        if (!finiteValues.length) return 0
        return Math.round(finiteValues.reduce((sum, value) => sum + value, 0) / finiteValues.length)
      }

      function resolveActorPosition(actorId, index = 0) {
        const configuredPosition = actorNodePositions[actorId]
        const hasValidCoordinates = Number.isFinite(Number(configuredPosition?.x))
          && Number.isFinite(Number(configuredPosition?.y))
        if (hasValidCoordinates) {
          return {
            x: clampPercent(configuredPosition.x),
            y: clampPercent(configuredPosition.y),
          }
        }

        const fallbackPositions = [
          { x: 18, y: 20 },
          { x: 50, y: 20 },
          { x: 82, y: 20 },
          { x: 26, y: 76 },
          { x: 58, y: 76 },
          { x: 86, y: 76 },
        ]
        return fallbackPositions[index % fallbackPositions.length]
      }

      function projectToneClass(project) {
        if (project.health === '高风险') return 'is-critical'
        if (project.health === '关注') return 'is-attention'
        return ''
      }

      function statusBadgeTone(value) {
        if (value === '高风险' || value === '危急') return 'is-risk'
        if (value === '关注' || value === '评审中') return 'is-attention'
        return 'is-live'
      }

      function projectMatchesFilter(project, filter) {
        if (filter === 'healthy') return project.health === '正常'
        if (filter === 'attention') return project.health === '关注'
        if (filter === 'risk') return project.health === '高风险'
        return true
      }

        return `

              <button class="primary-action" type="button" data-prototype-action="${safeAction}">${safeAction}</button>

        }

        const averageProgress = safeAverage(projects.map((project) => project.progress))
        const metrics = [
          ['项目总数', String(projects.length).padStart(2, '0'), '组合范围'],
          ['正常', String(projects.filter((project) => project.health === '正常').length).padStart(2, '0'), '节奏稳定'],

        const selectedActivity = selectedProject

        const projectSummaryRows = selectedProject ? [

            <dl class="context-list">${renderContextRows(projectSummaryRows)}</dl>

        ` : `

        return elementFromHTML(`
          <section class="page-view overview-shell" data-page="projects" aria-labelledby="projects-title">

            <div class="metric-grid" aria-label="项目组合关键指标">${renderMetricCards(metrics)}</div>
            <div class="portfolio-layout">
              <section class="signature-stage portfolio-stage" aria-labelledby="projects-signature-title">

                  <div><h2 id="projects-signature-title">玻璃项目矩阵</h2><span>${visibleProjects.length} / ${projects.length} 个项目</span></div>

                  <div class="project-matrix">${cards || '<div class="empty-state" data-project-empty><div><strong>没有匹配项目</strong>请切换健康筛选。</div></div>'}</div>
                </div>
              </section>
              ${projectSummaryMarkup}
            </div>
          </section>
        `)
      }

      function safeStringList(collection) {
        return Array.isArray(collection) ? collection.filter((item) => typeof item === 'string' && item) : []
      }

      function safeText(value, fallback) {
        return typeof value === 'string' && value.trim() ? value : fallback
      }

      function safeNumber(value, fallback = 0) {
        return typeof value === 'number' && Number.isFinite(value) ? value : fallback
      }

      function normalizeExecutionRecord(item, kind) {
        if (kind === 'task') return {
          ...item,
          code:safeText(item.code, 'TASK-UNKNOWN'),
          title:safeText(item.title, '未命名任务'),
          description:safeText(item.description, '暂无任务说明'),
          owner:safeText(item.owner, '未指派'),
          projectId:safeText(item.projectId, ''),
          project:safeText(item.project, '未知项目'),
          start:safeText(item.start, '日期未知'),
          due:safeText(item.due, '日期未知'),
          status:safeText(item.status, '待处理'),
          priority:safeText(item.priority, '未知'),
          progress:safeNumber(item.progress),
          scope:safeStringList(item.scope),
          dependencies:safeStringList(item.dependencies),
          tags:safeStringList(item.tags),
        }
        if (kind === 'requirement') return {
          ...item,
          code:safeText(item.code, 'REQ-UNKNOWN'),
          title:safeText(item.title, '未命名需求'),
          status:safeText(item.status, '收集'),
          owner:safeText(item.owner, '未指派'),
          priority:safeText(item.priority, '未知'),
          taskIds:safeStringList(item.taskIds),
          acceptanceCriteria:safeStringList(item.acceptanceCriteria),
          changeRisk:safeText(item.changeRisk, '未知'),
        }
        if (kind === 'defect') return {
          ...item,
          code:safeText(item.code, 'BUG-UNKNOWN'),
          title:safeText(item.title, '未命名缺陷'),
          severity:safeText(item.severity, '未知'),
          impact:safeText(item.impact, '未知'),
          status:safeText(item.status, '待分诊'),
          owner:safeText(item.owner, '未指派'),
          version:safeText(item.version, '未知版本'),
          requirementId:safeText(item.requirementId, ''),
          projectId:safeText(item.projectId, ''),
          steps:safeStringList(item.steps),
        }
        if (kind === 'milestone') return {
          ...item,
          phase:safeText(item.phase, '未知阶段'),
          name:safeText(item.name, '未命名里程碑'),
          date:safeText(item.date, '日期未知'),
          status:safeText(item.status, '未知'),
          summary:safeText(item.summary, '暂无里程碑说明'),
          owner:safeText(item.owner, '未指派'),
          risk:safeText(item.risk, '未知'),
        }
        if (kind === 'deliverable') return {
          ...item,
          projectId:safeText(item.projectId, ''),
          name:safeText(item.name, '未命名交付物'),
          status:safeText(item.status, '未知'),
          time:safeText(item.time, '时间未知'),
          owner:safeText(item.owner, '未指派'),
        }
        if (kind === 'handoff') return {
          ...item,
          projectId:safeText(item.projectId, ''),
          from:safeText(item.from, '未知交接方'),
          to:safeText(item.to, '未知接收方'),
          time:safeText(item.time, '时间未知'),
          summary:safeText(item.summary, '暂无交接说明'),
          status:safeText(item.status, '未知'),
        }
        return { ...item }
      }

      function safeRecords(collection) {
        if (!Array.isArray(collection)) return []
        const recordKind = collection === tasks ? 'task'
          : collection === requirements ? 'requirement'
          : collection === defects ? 'defect'
          : collection === milestones ? 'milestone'
          : collection === deliverables ? 'deliverable'
          : collection === handoffs ? 'handoff'
          : 'generic'
        return collection
          .filter((item) => item && typeof item === 'object' && typeof item.id === 'string' && item.id)
          .map((item) => normalizeExecutionRecord(item, recordKind))
      }

      function normalizeRecordSelection(stateKey, records) {
        const safeItems = safeRecords(records)
        if (!safeItems.some((item) => item.id === previewState[stateKey])) {
          previewState[stateKey] = safeItems[0]?.id ?? null
        }
        return safeItems.find((item) => item.id === previewState[stateKey]) ?? null
      }

      function effectiveTaskStatus(task) {
        return previewState.completedTaskIds instanceof Set && previewState.completedTaskIds.has(task?.id)
          ? '已完成'
          : String(task?.status || '待处理')
      }

      function executionStatusTone(status) {
        if (status === '进行中') return 'is-live'
        if (status === '逾期' || status === 'Blocker' || status === 'Critical') return 'is-risk'
        if (status === '待处理' || status === '待开始' || status === '高') return 'is-attention'
        return ''
      }

      function parseDemoDate(value) {
        if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(value)) return null
        const [year, month, day] = value.slice(0, 10).split('-').map(Number)
        const date = new Date(Date.UTC(year, month - 1, day))
        return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day
          ? date
          : null
      }

      function formatDemoDate(date) {
        return date instanceof Date && Number.isFinite(date.getTime()) ? date.toISOString().slice(0, 10) : '日期未知'
      }

      function dayDifference(from, to) {
        return Math.round((to.getTime() - from.getTime()) / 86400000)
      }

      function executionRange(range) {
        const reference = parseDemoDate(DEMO_REFERENCE_DATE) || new Date(Date.UTC(2026, 7, 22))
        const safeRange = rangeValues.has(range) ? range : 'month'
        let start
        let end
        if (safeRange === 'week') {
          start = new Date(reference)
          start.setUTCDate(start.getUTCDate() - ((start.getUTCDay() + 6) % 7))
          end = new Date(start)
          end.setUTCDate(end.getUTCDate() + 6)
        } else if (safeRange === 'quarter') {
          const quarterMonth = Math.floor(reference.getUTCMonth() / 3) * 3
          start = new Date(Date.UTC(reference.getUTCFullYear(), quarterMonth, 1))
          end = new Date(Date.UTC(reference.getUTCFullYear(), quarterMonth + 3, 0))
        } else {
          start = new Date(Date.UTC(reference.getUTCFullYear(), reference.getUTCMonth(), 1))
          end = new Date(Date.UTC(reference.getUTCFullYear(), reference.getUTCMonth() + 1, 0))
        }
        return { range:safeRange, start, end, days:dayDifference(start, end) + 1 }
      }

      function taskOverlapsRange(task, config) {
        const start = parseDemoDate(task?.start)
        const due = parseDemoDate(task?.due)
        return Boolean(start && due && start <= config.end && due >= config.start)
      }

      function taskMatchesScope(task, scope) {
        if (scope === 'all') return true
        return safeStringList(task?.scope).includes(scope)
      }

          </section>
        `)
      }

      function ganttScaleMarkup(config) {
        const points = []
        if (config.range === 'week') {
          for (let index = 0; index < 7; index += 1) {
            const date = new Date(config.start)
            date.setUTCDate(date.getUTCDate() + index)
            points.push({ left:((index + 0.5) / 7) * 100, label:`${date.getUTCMonth() + 1}/${date.getUTCDate()}` })
          }
        } else if (config.range === 'month') {
          for (let day = 1; day <= config.days; day += 7) points.push({ left:((day - 0.5) / config.days) * 100, label:`8/${day}` })
        } else {
          for (let month = config.start.getUTCMonth(); month <= config.end.getUTCMonth(); month += 1) {
            const monthStart = new Date(Date.UTC(config.start.getUTCFullYear(), month, 1))
            const monthEnd = new Date(Date.UTC(config.start.getUTCFullYear(), month + 1, 0))
            const midpoint = (dayDifference(config.start, monthStart) + dayDifference(config.start, monthEnd) + 1) / 2
            points.push({ left:(midpoint / config.days) * 100, label:`${month + 1} 月` })
          }
        }
        return points.map((point) => `<span style="--scale-left:${Math.max(0, Math.min(100, point.left)).toFixed(3)}%">${escapeHtml(point.label)}</span>`).join('')
      }

      function ganttStatusMeta(status) {
        if (status === '进行中') return { className:'is-in-progress', label:'进行中' }
        if (status === '逾期') return { className:'is-overdue', label:'逾期' }
        if (status === '已完成' || status === '完成') return { className:'is-complete', label:'完成' }
        return { className:'is-neutral', label:String(status || '待处理') }
      }

      function renderGantt() {
        if (!rangeValues.has(previewState.ganttRange)) previewState.ganttRange = 'month'
        const config = executionRange(previewState.ganttRange)
        const taskItems = safeRecords(tasks)
        const ganttTasks = taskItems.filter((task) => taskOverlapsRange(task, config))
        const selectedTask = normalizeRecordSelection('selectedGanttTaskId', ganttTasks)
        const taskIndexById = new Map(ganttTasks.map((task, index) => [task.id, index]))
        const validDependencies = []
        ganttTasks.forEach((task) => {
          safeStringList(task.dependencies).forEach((dependencyId) => {
            const from = ganttTasks.find((item) => item.id === dependencyId)
            if (from && taskIndexById.has(task.id)) validDependencies.push({ from, to:task })
          })
        })
        const rows = ganttTasks.map((task) => {
          const taskStart = parseDemoDate(task.start)
          const taskDue = parseDemoDate(task.due)
          const clippedStart = taskStart < config.start ? config.start : taskStart
          const clippedEnd = taskDue > config.end ? config.end : taskDue
          const startColumn = Math.max(1, dayDifference(config.start, clippedStart) + 1)
          const span = Math.max(1, dayDifference(clippedStart, clippedEnd) + 1)
          const statusMeta = ganttStatusMeta(effectiveTaskStatus(task))
          return `<div class="gantt-row"><button class="gantt-bar ${statusMeta.className}" type="button" data-gantt-task-id="${escapeHtml(task.id)}" data-focus-key="gantt-bar-${escapeHtml(task.id)}" aria-pressed="${selectedTask?.id === task.id}" style="--bar-start:${startColumn};--bar-span:${span}" aria-label="选择 ${escapeHtml(task.code)} ${escapeHtml(task.title)}，${escapeHtml(statusMeta.label)}">${escapeHtml(task.code)} · ${escapeHtml(task.title)}</button></div>`
        }).join('')
        const chartHeight = 46 + ganttTasks.length * 54
        const connectorPaths = validDependencies.map(({ from, to }) => {
          const fromDue = parseDemoDate(from.due)
          const toStart = parseDemoDate(to.start)
          const fromX = Math.max(0, Math.min(1000, ((dayDifference(config.start, fromDue) + 1) / config.days) * 1000))
          const toX = Math.max(0, Math.min(1000, (dayDifference(config.start, toStart) / config.days) * 1000))
          const fromY = 46 + taskIndexById.get(from.id) * 54 + 27
          const toY = 46 + taskIndexById.get(to.id) * 54 + 27
          const elbow = Math.max(fromX + 12, (fromX + toX) / 2)
          return `<path d="M ${fromX.toFixed(2)} ${fromY} H ${elbow.toFixed(2)} V ${toY} H ${toX.toFixed(2)}"></path>`
        }).join('')
        const dependencyText = validDependencies.map(({ from, to }) => `<li>${escapeHtml(from.code)} ${escapeHtml(from.title)} → ${escapeHtml(to.code)} ${escapeHtml(to.title)}</li>`).join('')
        const rangeButtons = [['week','周'],['month','月'],['quarter','季度']].map(([value, label]) => `<button type="button" data-gantt-range="${value}" data-focus-key="gantt-range-${value}" aria-pressed="${previewState.ganttRange === value}">${label}</button>`).join('')
        const widthByRange = { week:760, month:1040, quarter:1280 }
        const reference = parseDemoDate(DEMO_REFERENCE_DATE)
        const showToday = reference && reference >= config.start && reference <= config.end
        const todayLeft = showToday ? ((dayDifference(config.start, reference) + 0.5) / config.days) * 100 : 0
        const dependencies = selectedTask ? safeStringList(selectedTask.dependencies).map((id) => taskItems.find((task) => task.id === id)?.title || `未找到依赖（${id}）`) : []
        const inspectorRows = selectedTask ? [
          ['任务编号', selectedTask.code],
          ['状态', effectiveTaskStatus(selectedTask) === '已完成' ? '完成' : effectiveTaskStatus(selectedTask)],
          ['负责人', selectedTask.owner],
          ['开始', selectedTask.start],
          ['截止', selectedTask.due],
          ['依赖', dependencies.join('；') || '无'],
        ] : []
        const metrics = [
          ['计划任务', String(ganttTasks.length).padStart(2, '0'), rangeLabels.get(previewState.ganttRange)],
          ['进行中', String(ganttTasks.filter((task) => effectiveTaskStatus(task) === '进行中').length).padStart(2, '0'), '绿色'],
          ['完成', String(ganttTasks.filter((task) => effectiveTaskStatus(task) === '已完成').length).padStart(2, '0'), '银色'],
          ['逾期', String(ganttTasks.filter((task) => effectiveTaskStatus(task) === '逾期').length).padStart(2, '0'), '红色'],
        ]

        return elementFromHTML(`
          <section class="page-view execution-shell" data-page="gantt" aria-labelledby="gantt-title">
            ${renderOverviewHeader('gantt', '通过局部横向时间线校准任务范围、状态和安全依赖连接。', '调整排程')}
            <div class="metric-grid" aria-label="甘特排程关键指标">${renderMetricCards(metrics)}</div>
            <div class="gantt-layout">
              <section class="signature-stage gantt-stage" aria-labelledby="gantt-stage-title">
                <div class="signature-heading"><div><h2 id="gantt-stage-title">横向任务排程</h2><span>${formatDemoDate(config.start)} — ${formatDemoDate(config.end)}</span></div><div class="segmented" role="group" aria-label="甘特时间范围">${rangeButtons}</div></div>
                <div class="gantt-scroll" tabindex="0" aria-label="甘特时间线，可横向滚动" aria-describedby="${showToday ? 'gantt-today-description ' : ''}gantt-dependencies">
                  <div class="gantt-canvas" style="min-width:${widthByRange[previewState.ganttRange]}px;--gantt-columns:${config.days};--gantt-height:${Math.max(chartHeight, 180)}px">
                    <div class="gantt-scale">${ganttScaleMarkup(config)}</div>
                    ${ganttTasks.length ? rows : '<div class="empty-state"><div><strong>当前范围暂无任务</strong>调整甘特时间范围后继续查看。</div></div>'}
                    <svg class="gantt-connectors" viewBox="0 0 1000 ${Math.max(chartHeight, 180)}" preserveAspectRatio="none" aria-hidden="true">${connectorPaths}</svg>
                    ${showToday ? `<div class="gantt-today" style="--today-left:${todayLeft.toFixed(3)}%" aria-hidden="true"><span>今日 ${escapeHtml(DEMO_REFERENCE_DATE.slice(5))}</span></div>` : ''}
                  </div>
                </div>
                ${showToday ? `<p class="sr-only" id="gantt-today-description">今日：${escapeHtml(DEMO_REFERENCE_DATE)}</p>` : ''}
                <div id="gantt-dependencies"><p class="summary-note">依赖关系文字等价：</p>${dependencyText ? `<ul class="dependency-summary">${dependencyText}</ul>` : '<p class="summary-note">当前范围没有有效依赖；坏引用已安全跳过。</p>'}</div>
              </section>
              <section class="context-panel gantt-inspector" aria-labelledby="gantt-inspector-title">
                <div class="panel-heading"><h2 id="gantt-inspector-title">${escapeHtml(selectedTask?.title || '任务检查器')}</h2><span class="status-badge ${executionStatusTone(selectedTask ? effectiveTaskStatus(selectedTask) : '')}">${escapeHtml(selectedTask ? (effectiveTaskStatus(selectedTask) === '已完成' ? '完成' : effectiveTaskStatus(selectedTask)) : '无选择')}</span></div>
                ${selectedTask ? `<dl class="context-list">${renderContextRows(inspectorRows)}</dl><p class="summary-note">${escapeHtml(selectedTask.description)}</p>` : '<div class="empty-state"><div><strong>暂无排程任务</strong>当前时间范围没有可检查任务。</div></div>'}
              </section>
            </div>
          </section>
        `)
      }

      function defectSeverityClass(severity) {
        const normalized = String(severity || '').toLowerCase()
        if (normalized === 'blocker') return 'severity-blocker'
        if (normalized === 'critical') return 'severity-critical'
        if (normalized === '高') return 'severity-high'
        return 'severity-standard'
      }

      function renderDefects() {
        const severityLevels = ['Blocker','Critical','高','中','低']
        const impactLevels = ['高','中','低']
        const defectItems = safeRecords(defects)
        const selectedDefect = normalizeRecordSelection('selectedDefectId', defectItems)
        const requirementItems = safeRecords(requirements)
        const projectItems = safeRecords(projects)
        const matrixRows = severityLevels.map((severity) => {
          const cells = impactLevels.map((impact) => {
            const matches = defectItems.filter((defect) => defect.severity === severity && defect.impact === impact)
            const content = matches.length ? `<ul class="defect-cell-list">${matches.map((defect) => `<li><button class="defect-button ${defectSeverityClass(defect.severity)}" type="button" data-defect-id="${escapeHtml(defect.id)}" data-focus-key="defects-matrix-${escapeHtml(defect.id)}" aria-pressed="${selectedDefect?.id === defect.id}">${escapeHtml(defect.code)}<br>${escapeHtml(defect.title)}</button></li>`).join('')}</ul>` : '<span class="defect-cell-empty">无缺陷</span>'
            return `<td>${content}</td>`
          }).join('')
          return `<tr><th scope="row">${escapeHtml(severity)}</th>${cells}</tr>`
        }).join('')
        const severityRank = new Map(severityLevels.map((value, index) => [value, index]))
        const triageItems = defectItems.slice().sort((a, b) => (severityRank.get(a.severity) ?? 99) - (severityRank.get(b.severity) ?? 99)).slice(0, 3)
        const triageMarkup = triageItems.length ? triageItems.map((defect) => `<li><button class="defect-button ${defectSeverityClass(defect.severity)}" type="button" data-defect-id="${escapeHtml(defect.id)}" data-focus-key="defects-triage-${escapeHtml(defect.id)}" aria-pressed="${selectedDefect?.id === defect.id}">${escapeHtml(defect.code)} · ${escapeHtml(defect.severity)}<br>${escapeHtml(defect.owner)} · ${escapeHtml(defect.status)}</button></li>`).join('') : '<li class="requirement-column-empty">当前没有待分诊缺陷</li>'
        let relatedRecord = '无'
        if (selectedDefect?.requirementId) {

          relatedRecord = requirement ? `${requirement.code} · ${requirement.title}` : `未找到需求（${selectedDefect.requirementId}）`

          const project = projectItems.find((item) => item.id === selectedDefect.projectId)
          relatedRecord = project ? project.name : `未找到项目（${selectedDefect.projectId}）`

        const defectRows = selectedDefect ? [

          ['负责人', selectedDefect.owner],

          ['回归中', String(defectItems.filter((item) => item.status === '回归中').length).padStart(2, '0'), '等待证据'],
        ]

        return elementFromHTML(`
          <section class="page-view execution-shell" data-page="defects" aria-labelledby="defects-title">

                  </div>
                </div>
              </fieldset>
              <div class="settings-actions"><button class="primary-action" type="button" data-prototype-action="记录数据偏好">记录当前偏好</button></div>
            </form>
          `,
          mcp: `
            <form class="settings-form" data-settings-form aria-labelledby="settings-detail-title">
              <fieldset>
                <legend>MCP 本地连接预览</legend>
                <div class="settings-control">
                  <label for="settings-mcp-endpoint">Endpoint</label>
                  <input id="settings-mcp-endpoint" name="endpoint" type="text" value="http://127.0.0.1:3100/mcp" autocomplete="off" spellcheck="false" />
                </div>
                <div class="settings-control">
                  <label for="settings-mcp-policy">连接策略</label>
                  <select id="settings-mcp-policy" name="connection-policy">
                    <option value="manual" selected>仅手动测试</option>
                    <option value="workspace">进入工作区时检查</option>
                  </select>
                </div>
              </fieldset>
              <p class="settings-preview-note">测试按钮仅提供界面反馈，不会发起网络请求。</p>
              <div class="settings-actions"><button class="secondary-action" type="button" data-prototype-action="测试 MCP 连接">测试连接</button><button class="primary-action" type="button" data-prototype-action="记录 MCP 配置">记录配置</button></div>
            </form>
          `,
          skills: `
            <form class="settings-form" data-settings-form aria-labelledby="settings-detail-title">
              <fieldset>
                <legend>可启用的 Skills</legend>
                <div class="settings-checkbox-row">
                  <label class="settings-checkbox" for="settings-skill-planning"><input id="settings-skill-planning" name="skills" type="checkbox" value="planning" checked /><span>项目规划<small>生成阶段拆解与交付检查点。</small></span></label>
                  <label class="settings-checkbox" for="settings-skill-review"><input id="settings-skill-review" name="skills" type="checkbox" value="review" checked /><span>质量复核<small>提供需求、缺陷与验收的检查视角。</small></span></label>
                  <label class="settings-checkbox" for="settings-skill-handoff"><input id="settings-skill-handoff" name="skills" type="checkbox" value="handoff" /><span>交接摘要<small>整理当前上下文中的交接要点。</small></span></label>
                </div>
              </fieldset>
              <div class="settings-actions"><button class="secondary-action" type="button" data-prototype-action="导出 Skills 配置">导出配置</button><button class="primary-action" type="button" data-prototype-action="记录 Skills 偏好">记录技能偏好</button></div>
            </form>
          `,
        }[activeSection]

        return elementFromHTML(`
          <section class="page-view settings-shell" data-page="settings" aria-labelledby="settings-title">
            <header class="page-header">
              <div>
                <p class="page-kicker">Project OS / settings</p>
                <h1 id="settings-title" tabindex="-1">设置中心</h1>
                <p class="page-description">集中调整界面、数据、MCP 与 Skills 的预览偏好；所有变化只停留在当前页面。</p>
              </div>
              <div class="header-actions">
                <button class="secondary-action" type="button" data-prototype-action="导出设置快照">导出快照</button>
                <button class="primary-action" type="button" data-prototype-action="记录设置快照">记录设置快照</button>
              </div>
            </header>
            <div class="settings-layout">
              <nav class="glass-panel settings-category-panel" aria-label="设置分类">
                <ul class="settings-category-list">${categoryMarkup}</ul>
              </nav>
              <section class="glass-panel settings-detail" id="settings-detail-panel" aria-labelledby="settings-detail-title">
                <div class="panel-heading"><div><h2 id="settings-detail-title">${escapeHtml(activeLabel)}</h2><p>预览模式 · 不会持久化</p></div><span class="status-badge">本页内</span></div>
                ${formMarkup}
              </section>
            </div>
          </section>
        `)
      }

      function assertRouteRegistry() {
        const expectedRoutes = new Set(routeOrder)
        if (expectedRoutes.size !== routeOrder.length) {
          throw new Error('Route registry mismatch: routeOrder contains duplicates')
        }

        const routeRegistries = {
          pageTitles: Object.keys(pageTitles),
          pageRenderers: Object.keys(pageRenderers),
          pageShells: Object.keys(pageShells),
          navigation: Array.from(document.querySelectorAll('[data-route]'), (link) => link.dataset.route),
        }

        Object.entries(routeRegistries).forEach(([name, routes]) => {
          const actualRoutes = new Set(routes)
          const matches = routes.length === routeOrder.length
            && actualRoutes.size === expectedRoutes.size
            && routeOrder.every((route) => actualRoutes.has(route))

          if (!matches) throw new Error(`Route registry mismatch: ${name}`)
        })
      }

      function currentRoute() {
        const candidate = location.hash.replace(/^#\/?/, '')
        return routeOrder.includes(candidate) ? candidate : 'dashboard'
      }

      function canonicalizeRouteHash(route) {
        const canonicalHash = `#${route}`
        if (location.hash !== canonicalHash) history.replaceState(null, '', canonicalHash)
      }

      function renderCurrentPage({ focusHeading = false } = {}) {
        const route = currentRoute()
        canonicalizeRouteHash(route)

        document.querySelectorAll('[data-route]').forEach((link) => {
          const active = link.dataset.route === route
          link.classList.toggle('is-active', active)
          active ? link.setAttribute('aria-current', 'page') : link.removeAttribute('aria-current')
        })

        pageRoot.replaceChildren(pageRenderers[route]())
        document.title = `Project OS · ${pageTitles[route]}`

        if (focusHeading) pageRoot.querySelector('h1')?.focus()
      }

      function showToast(message) {
        clearTimeout(toastTimer)
        clearTimeout(toastClearTimer)
        toastTimer = 0
        toastClearTimer = 0
        toast.textContent = message
        toast.classList.add('is-visible')
        toastTimer = window.setTimeout(() => {
          toast.classList.remove('is-visible')
          const clearDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180
          toastClearTimer = window.setTimeout(() => {
            toast.textContent = ''
            toastClearTimer = 0
          }, clearDelay)
          toastTimer = 0
        }, 2200)
      }

      function announceSelection(message) {
        showToast(message)
      }

      function rerenderCurrentPageAndRestoreFocus(attribute, value, focusKey) {
        renderCurrentPage()
        const target = focusKey
          ? Array.from(pageRoot.querySelectorAll('[data-focus-key]'))
            .find((element) => element.dataset.focusKey === focusKey)
          : Array.from(pageRoot.querySelectorAll(`[${attribute}]`))
            .find((element) => element.getAttribute(attribute) === value)
        target?.focus()
      }

      document.addEventListener('click', (event) => {
        const target = event.target instanceof Element ? event.target : null
        if (!target) return

        const skipTarget = target.closest('.skip-link')
        if (skipTarget) {
          event.preventDefault()
          mainContent.focus()
          return
        }

        const disabledControl = target.closest('[aria-disabled="true"]')
        if (disabledControl) return

        const dashboardSelection = target.closest('[data-dashboard-select]')
        if (dashboardSelection) {
          const selection = dashboardSelection.dataset.dashboardSelect
          const isKnownRisk = riskQueue.some((risk) => risk.id === selection)
          const isKnownActor = actors.some((actor) => actor.id === selection)
          if (isKnownRisk || isKnownActor) {
            previewState.dashboardSelection = selection
            rerenderCurrentPageAndRestoreFocus('data-dashboard-select', selection, dashboardSelection.dataset.focusKey)
            const selectedRisk = riskQueue.find((risk) => risk.id === selection)
            const selectedActor = actors.find((actor) => actor.id === selection)
            announceSelection(selectedRisk
              ? `已选择风险：${selectedRisk.title}`
              : `已选择协作者：${selectedActor.name}`)
          }
          return
        }

        const projectFilter = target.closest('[data-project-filter]')
        if (projectFilter) {
          const filter = projectFilter.dataset.projectFilter
          if (projectFilterValues.has(filter)) {
            previewState.projectFilter = filter
            const visibleProjects = projects.filter((project) => projectMatchesFilter(project, filter))
            if (!visibleProjects.some((project) => project.id === previewState.selectedProjectId)) {
              previewState.selectedProjectId = visibleProjects[0]?.id ?? null
            }
            rerenderCurrentPageAndRestoreFocus('data-project-filter', filter, projectFilter.dataset.focusKey)
            announceSelection(`项目筛选：${projectFilterLabels.get(filter)}，${visibleProjects.length ? `${visibleProjects.length} 个项目` : '无匹配项目'}`)
          }
          return
        }

        const projectSelection = target.closest('[data-project-id]')
        if (projectSelection) {
          const projectId = projectSelection.dataset.projectId
          const project = projects.find((item) => item.id === projectId)
          if (project && projectMatchesFilter(project, previewState.projectFilter)) {
            previewState.selectedProjectId = projectId
            rerenderCurrentPageAndRestoreFocus('data-project-id', projectId, projectSelection.dataset.focusKey)
            announceSelection(`已选择项目：${project.name}`)
          }
          return
        }

        const actorFilter = target.closest('[data-actor-filter]')
        if (actorFilter) {
          const filter = actorFilter.dataset.actorFilter
          if (actorFilterValues.has(filter)) {
            previewState.actorFilter = filter
            const visibleActors = actors.filter((actor) => filter === 'all' || actor.type === filter)
            if (!visibleActors.some((actor) => actor.id === previewState.selectedActorId)) {
              previewState.selectedActorId = visibleActors[0]?.id ?? null
            }
            rerenderCurrentPageAndRestoreFocus('data-actor-filter', filter, actorFilter.dataset.focusKey)
            announceSelection(`协作者筛选：${actorFilterLabels.get(filter)}，${visibleActors.length ? `${visibleActors.length} 位协作者` : '无匹配协作者'}`)
          }
          return
        }

        const actorSelection = target.closest('[data-actor-id]')
        if (actorSelection) {
          const actorId = actorSelection.dataset.actorId
          const actor = actors.find((item) => item.id === actorId)
          if (actor && (previewState.actorFilter === 'all' || actor.type === previewState.actorFilter)) {
            previewState.selectedActorId = actorId
            rerenderCurrentPageAndRestoreFocus('data-actor-id', actorId, actorSelection.dataset.focusKey)
            announceSelection(`已选择协作者：${actor.name}`)
          }
          return
        }

        const milestoneSelection = target.closest('[data-milestone-id]')
        if (milestoneSelection) {
          const milestoneId = milestoneSelection.dataset.milestoneId
          const milestone = safeRecords(milestones).find((item) => item.id === milestoneId)
          if (milestone) {
            previewState.selectedMilestoneId = milestoneId
            rerenderCurrentPageAndRestoreFocus('data-milestone-id', milestoneId, milestoneSelection.dataset.focusKey)
            announceSelection(`里程碑：${milestone.name}，仅更新项目上下文`)
          }
          return
        }

        const taskScope = target.closest('[data-task-scope]')
        if (taskScope) {
          const scope = taskScope.dataset.taskScope
          if (taskScopeValues.has(scope)) {
            previewState.taskScope = scope
            const visibleTasks = safeRecords(tasks).filter((task) => taskMatchesScope(task, scope))
            if (!visibleTasks.some((task) => task.id === previewState.selectedTaskId)) {
              previewState.selectedTaskId = visibleTasks[0]?.id ?? null
            }
            rerenderCurrentPageAndRestoreFocus('data-task-scope', scope, taskScope.dataset.focusKey)
            announceSelection(`任务范围：${taskScopeLabels.get(scope)}，${visibleTasks.length ? `${visibleTasks.length} 项任务` : '暂无任务'}`)
          }
          return
        }

        const taskRange = target.closest('[data-task-range]')
        if (taskRange) {
          const range = taskRange.dataset.taskRange
          if (rangeValues.has(range)) {
            previewState.taskRange = range
            rerenderCurrentPageAndRestoreFocus('data-task-range', range, taskRange.dataset.focusKey)
            announceSelection(`交付时间线：${rangeLabels.get(range)}，只更新预览范围`)
          }
          return
        }

        const taskSelection = target.closest('[data-task-id]')
        if (taskSelection) {
          const taskId = taskSelection.dataset.taskId
          const task = safeRecords(tasks).find((item) => item.id === taskId)
          if (task && taskMatchesScope(task, previewState.taskScope)) {
            previewState.selectedTaskId = taskId
            rerenderCurrentPageAndRestoreFocus('data-task-id', taskId, taskSelection.dataset.focusKey)
            announceSelection(`任务：${task.code} ${task.title}`)
          }
          return
        }

        const taskDetail = target.closest('[data-task-detail]')
        if (taskDetail) {
          const taskId = taskDetail.dataset.taskDetail
          const task = safeRecords(tasks).find((item) => item.id === taskId)
          if (task && taskMatchesScope(task, previewState.taskScope)) {
            previewState.selectedTaskId = taskId
            rerenderCurrentPageAndRestoreFocus('data-task-detail', taskId, taskDetail.dataset.focusKey)
            announceSelection(`任务详情：${task.code} ${task.title}`)
          }
          return
        }

        const taskComplete = target.closest('[data-task-complete]')
        if (taskComplete) {
          const taskId = taskComplete.dataset.taskComplete
          const task = safeRecords(tasks).find((item) => item.id === taskId)
          if (task) {
            if (effectiveTaskStatus(task) === '已完成') return
            if (!(previewState.completedTaskIds instanceof Set)) previewState.completedTaskIds = new Set()
            previewState.completedTaskIds.add(taskId)
            previewState.selectedTaskId = taskId
            rerenderCurrentPageAndRestoreFocus('data-task-complete', taskId, taskComplete.dataset.focusKey)
            announceSelection(`${task.code} 已标记为预览完成态；仅保存在本页内存，未写入系统`)
          }
          return
        }

        const ganttRange = target.closest('[data-gantt-range]')
        if (ganttRange) {
          const range = ganttRange.dataset.ganttRange
          if (rangeValues.has(range)) {
            previewState.ganttRange = range
            rerenderCurrentPageAndRestoreFocus('data-gantt-range', range, ganttRange.dataset.focusKey)
            announceSelection(`甘特范围：${rangeLabels.get(range)}，只更新当前排程视图`)
          }
          return
        }

        const ganttTask = target.closest('[data-gantt-task-id]')
        if (ganttTask) {
          const taskId = ganttTask.dataset.ganttTaskId
          const task = safeRecords(tasks).find((item) => item.id === taskId)
          if (task) {
            previewState.selectedGanttTaskId = taskId
            rerenderCurrentPageAndRestoreFocus('data-gantt-task-id', taskId, ganttTask.dataset.focusKey)
            announceSelection(`甘特任务：${task.code} ${task.title}`)
          }
          return
        }

        const requirementSelection = target.closest('[data-requirement-id]')
        if (requirementSelection) {
          const requirementId = requirementSelection.dataset.requirementId
          const requirement = safeRecords(requirements).find((item) => item.id === requirementId)
          if (requirement) {
            previewState.selectedRequirementId = requirementId
            rerenderCurrentPageAndRestoreFocus('data-requirement-id', requirementId, requirementSelection.dataset.focusKey)
            announceSelection(`需求：${requirement.code} ${requirement.title}`)
          }
          return
        }

        const defectSelection = target.closest('[data-defect-id]')
        if (defectSelection) {
          const defectId = defectSelection.dataset.defectId
          const defect = safeRecords(defects).find((item) => item.id === defectId)
          if (defect) {
            previewState.selectedDefectId = defectId
            rerenderCurrentPageAndRestoreFocus('data-defect-id', defectId, defectSelection.dataset.focusKey)
            announceSelection(`缺陷：${defect.code} ${defect.title}`)
          }
          return
        }

        const settingsSection = target.closest('[data-settings-section]')
        if (settingsSection) {
          const section = settingsSection.dataset.settingsSection
          const settingsLabels = new Map([['appearance', '外观'], ['data', '数据'], ['mcp', 'MCP'], ['skills', 'Skills']])
          if (settingsLabels.has(section)) {
            previewState.settingsSection = section
            rerenderCurrentPageAndRestoreFocus('data-settings-section', section, settingsSection.dataset.focusKey)
            announceSelection(`已切换设置分类：${settingsLabels.get(section)}`)
          }
          return
        }

        const action = target.closest('[data-prototype-action]')
        if (action) showToast(`已记录原型操作：${action.dataset.prototypeAction}。预览模式，未保存、未连接、未导出。`)
      })

      document.addEventListener('submit', (event) => {
        if (!event.target.matches('[data-settings-form]')) return
        event.preventDefault()
        showToast('已记录原型操作。预览模式，未提交或持久化设置。')
      })

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return
        document.querySelectorAll('[data-compact-nav].is-open').forEach((nav) => {
          nav.classList.remove('is-open')
          nav.setAttribute('aria-expanded', 'false')
        })
      })

      window.addEventListener('hashchange', () => renderCurrentPage({ focusHeading: true }))

      assertRouteRegistry()
      if (!location.hash) history.replaceState(null, '', '#dashboard')
      renderCurrentPage()
    </script>
  </body>
</html>
