<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Project OS · 多页面视觉预览</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030504;
        --surface: rgba(18, 22, 20, 0.74);
        --surface-raised: rgba(28, 33, 30, 0.82);
        --line: rgba(226, 240, 233, 0.16);
        --line-bright: rgba(245, 255, 250, 0.34);
        --text: #f3f7f4;
        --muted: #8d9791;
        --green: #37f58a;
        --green-deep: #10b965;
        --red: #ff5c61;
        --amber: #ffb45c;
        --radius-panel: 20px;
        --radius-card: 14px;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.52);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 78% 8%, rgba(55, 245, 138, 0.08), transparent 28rem),
          linear-gradient(145deg, #020403 0%, #070b09 50%, #030504 100%);
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }

      .skip-link {
        position: fixed;
        z-index: 100;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border: 1px solid var(--green);
        border-radius: 10px;
        color: var(--text);
        background: #0b110e;
        transform: translateY(-160%);
        transition: transform 160ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .ambient {
        position: fixed;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, black, transparent 92%);
      }

      .app-shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side-rail {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        width: 220px;
        height: 100vh;
        padding: 24px 16px 16px;
        border-right: 1px solid var(--line);
        background: rgba(4, 7, 5, 0.8);
        box-shadow: 16px 0 42px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(24px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 42px;
        padding: 0 8px 20px;
      }

      .brand-mark {
        position: relative;
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(55, 245, 138, 0.48);
        border-radius: 11px;
        color: var(--green);
        background: linear-gradient(145deg, rgba(55, 245, 138, 0.14), rgba(10, 15, 12, 0.82));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.18), 0 0 20px rgba(55, 245, 138, 0.12);
        font-size: 17px;
        font-weight: 750;
      }

      .brand-copy strong,
      .brand-copy span {
        display: block;
      }

      .brand-copy strong {
        letter-spacing: 0.02em;
      }

      .brand-copy span {
        margin-top: 1px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .rail-scroll {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .nav-group + .nav-group {
        margin-top: 17px;
      }

      .nav-label {
        margin: 0 9px 7px;
        color: #68716c;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .nav-list {
        display: grid;
        gap: 3px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-link {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 8px 10px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 11px;
        color: #9ca6a0;
        text-decoration: none;
        transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .nav-link::after {
        position: absolute;
        top: 10px;
        right: -1px;
        bottom: 10px;
        width: 2px;
        border-radius: 2px;
        background: var(--green);
        box-shadow: 0 0 12px var(--green);
        content: "";
        opacity: 0;
      }

      .nav-link:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.035);
      }

      .nav-link.is-active {
        border-color: rgba(55, 245, 138, 0.16);
        color: var(--text);
        background: linear-gradient(90deg, rgba(55, 245, 138, 0.11), rgba(255, 255, 255, 0.025));
      }

      .nav-link.is-active::after {
        opacity: 1;
      }

      .nav-icon {
        width: 18px;
        color: currentColor;
        text-align: center;
        font-size: 12px;
      }

      .rail-footer {
        display: grid;
        gap: 8px;
        padding-top: 12px;
      }

      .workspace-card,
      .user-card {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.026);
      }

      .workspace-card::before,
      .user-avatar {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 9px;
        color: var(--green);
        background: rgba(55, 245, 138, 0.1);
      }

      .workspace-card::before {
        content: "⌁";
      }

      .user-avatar {
        border-radius: 50%;
        color: var(--text);
        background: linear-gradient(145deg, #37423c, #171d19);
        font-size: 11px;
        font-weight: 700;
      }

      .rail-card-copy {
        min-width: 0;
      }

      .rail-card-copy span,
      .rail-card-copy strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rail-card-copy span {
        color: var(--muted);
        font-size: 10px;
      }

      .rail-card-copy strong {
        margin-top: 1px;
        font-size: 11px;
        font-weight: 650;
      }

      .page-main {
        min-width: 0;
        padding: 26px clamp(20px, 3.2vw, 48px) 44px;
      }

      [data-page-root] {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .page-view {
        animation: page-in 260ms ease both;
      }

      @keyframes page-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 22px;
      }

      .page-kicker {
        margin: 0 0 6px;
        color: var(--green);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .page-header h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 42px);
        font-weight: 680;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .page-description {
        max-width: 640px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .primary-action,
      .secondary-action {
        min-height: 38px;
        padding: 8px 14px;
        border-radius: 11px;
        cursor: pointer;
      }

      .primary-action {
        border: 1px solid rgba(55, 245, 138, 0.52);
        color: var(--text);
        background: linear-gradient(145deg, rgba(30, 44, 36, 0.94), rgba(8, 13, 10, 0.94));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.13), 0 0 22px rgba(55, 245, 138, 0.09);
        font-weight: 650;
      }

      .secondary-action {
        border: 1px solid var(--line);
        color: #cbd3ce;
        background: rgba(255, 255, 255, 0.035);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
        margin-bottom: 14px;
      }

      .metric-card,
      .glass-panel,
      .context-panel,
      .signature-stage {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, rgba(28, 33, 30, 0.72), var(--surface));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.075), var(--shadow);
        backdrop-filter: blur(22px);
      }

      .metric-card::before,
      .glass-panel::before,
      .context-panel::before,
      .signature-stage::before {
        position: absolute;
        top: 0;
        right: 12%;
        left: 12%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--line-bright), transparent);
        content: "";
        opacity: 0.64;
      }

      .metric-card {
        min-height: 98px;
        padding: 16px;
        border-radius: var(--radius-card);
      }

      .metric-label {
        color: var(--muted);
        font-size: 11px;
      }

      .metric-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }

      .metric-value {
        font-size: 25px;
        font-weight: 680;
        letter-spacing: -0.04em;
      }

      .metric-trend {
        color: var(--green);
        font-size: 10px;
      }

      .glass-panel {
        padding: 19px;
        border-radius: var(--radius-panel);
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
      }

      .panel-heading h2,
      .context-panel h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      .panel-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
      }

      .segmented {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.2);
      }

      .segmented button {
        min-height: 27px;
        padding: 4px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 10px;
      }

      .segmented button[aria-pressed="true"] {
        color: var(--text);
        background: rgba(55, 245, 138, 0.11);
        box-shadow: inset 0 0 0 1px rgba(55, 245, 138, 0.2);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 22px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #b7c0ba;
        background: rgba(255, 255, 255, 0.034);
        font-size: 10px;
        white-space: nowrap;
      }

      .status-badge::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
        box-shadow: 0 0 7px currentColor;
      }

      .status-badge.is-live {
        border-color: rgba(55, 245, 138, 0.22);
        color: var(--green);
      }

      .status-badge.is-attention {
        border-color: rgba(255, 180, 92, 0.24);
        color: var(--amber);
      }

      .status-badge.is-risk {
        border-color: rgba(255, 92, 97, 0.28);
        color: var(--red);
      }

      .content-frame {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(245px, 0.72fr);
        gap: 14px;
        margin-top: 14px;
      }

      .context-panel {
        min-width: 0;
        padding: 19px;
        border-radius: var(--radius-panel);
      }

      .context-list {
        display: grid;
        gap: 0;
        margin: 13px 0 0;
      }

      .context-list div {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(226, 240, 233, 0.09);
      }

      .context-list dt {
        color: var(--muted);
      }

      .context-list dd {
        margin: 0;
        text-align: right;
      }

      .signature-stage {
        min-height: 310px;
        padding: 20px;
        border-color: rgba(226, 240, 233, 0.2);
        border-radius: var(--radius-panel);
        background:
          radial-gradient(circle at 74% 16%, rgba(55, 245, 138, 0.1), transparent 15rem),
          linear-gradient(148deg, rgba(32, 38, 34, 0.78), rgba(9, 13, 11, 0.88));
      }

      .signature-stage::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(255, 255, 255, 0.023) 1px, transparent 1px);
        background-size: 100% 42px;
        content: "";
        mask-image: linear-gradient(90deg, transparent, black 18%, black 82%, transparent);
      }

      .signature-heading {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .signature-heading h2 {
        margin: 0;
        font-size: 14px;
      }

      .signature-heading span {
        color: var(--muted);
        font-size: 10px;
      }

      .signature-visual {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(5, minmax(98px, 1fr));
        align-items: end;
        gap: 10px;
        min-width: 570px;
        min-height: 224px;
        padding: 28px 4px 4px;
      }

      .visual-item {
        position: relative;
        min-height: calc(72px + var(--level, 1) * 16px);
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.08), 0 15px 28px rgba(0, 0, 0, 0.22);
      }

      .visual-item::before {
        display: block;
        width: 6px;
        height: 6px;
        margin-bottom: 26px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 13px rgba(55, 245, 138, 0.72);
        content: "";
      }

      .visual-item.is-amber::before {
        background: var(--amber);
        box-shadow: 0 0 13px rgba(255, 180, 92, 0.5);
      }

      .visual-item.is-red::before {
        background: var(--red);
        box-shadow: 0 0 13px rgba(255, 92, 97, 0.52);
      }

      .visual-item strong,
      .visual-item span {
        display: block;
      }

      .visual-item strong {
        font-size: 11px;
        font-weight: 650;
      }

      .visual-item span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }

      .stage-scroll {
        overflow-x: auto;
        scrollbar-color: rgba(55, 245, 138, 0.34) transparent;
        scrollbar-width: thin;
      }

      .empty-state {
        display: grid;
        min-height: 168px;
        padding: 20px;
        place-items: center;
        border: 1px dashed rgba(226, 240, 233, 0.2);
        border-radius: var(--radius-card);
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
      }

      .toast {
        position: fixed;
        z-index: 50;
        right: 20px;
        bottom: 20px;
        max-width: min(360px, calc(100vw - 40px));
        padding: 11px 14px;
        border: 1px solid var(--line-bright);
        border-radius: 11px;
        color: var(--text);
        background: rgba(15, 20, 17, 0.96);
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 1080px) {
        .metric-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .content-frame {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .app-shell {
          display: block;
        }

        .side-rail {
          position: relative;
          width: 100%;
          height: auto;
          padding: 14px 14px 10px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .brand {
          padding-bottom: 10px;
        }

        .rail-scroll {
          overflow-x: auto;
          overflow-y: hidden;
        }

        .rail-scroll,
        .nav-list {
          display: flex;
        }

        .nav-group,
        .nav-group + .nav-group {
          margin: 0 12px 0 0;
        }

        .nav-label,
        .rail-footer {
          display: none;
        }

        .nav-list {
          gap: 5px;
        }

        .nav-link {
          min-height: 35px;
          white-space: nowrap;
        }

        .nav-link::after {
          top: auto;
          right: 10px;
          bottom: 0;
          left: 10px;
          width: auto;
          height: 2px;
        }

        .page-main {
          padding: 24px 16px 36px;
        }

        .page-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .header-actions {
          justify-content: flex-start;
        }
      }

      @media (max-width: 520px) {
        .metric-grid {
          grid-template-columns: 1fr;
        }

        .metric-card {
          min-height: 86px;
        }

        .signature-stage {
          padding: 16px;
        }

        .glass-panel,
        .context-panel {
          padding: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .page-view,
        .toast,
        .skip-link {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="ambient" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="side-rail" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">P</div>
          <div class="brand-copy">
            <strong>Project OS</strong>
            <span>Delivery system</span>
          </div>
        </div>

        <div class="rail-scroll">
          <nav aria-label="页面导航">
            <section class="nav-group" aria-labelledby="nav-overview">
              <h2 class="nav-label" id="nav-overview">概览</h2>
              <ul class="nav-list">
                <li><a class="nav-link" href="#dashboard" data-route="dashboard"><span class="nav-icon" aria-hidden="true">◫</span>全局驾驶舱</a></li>
                <li><a class="nav-link" href="#projects" data-route="projects"><span class="nav-icon" aria-hidden="true">◇</span>项目矩阵</a></li>
                <li><a class="nav-link" href="#actors" data-route="actors"><span class="nav-icon" aria-hidden="true">◎</span>协作者网络</a></li>
              </ul>
            </section>

            <section class="nav-group" aria-labelledby="nav-delivery">
              <h2 class="nav-label" id="nav-delivery">交付</h2>
              <ul class="nav-list">
                <li><a class="nav-link" href="#project-detail" data-route="project-detail"><span class="nav-icon" aria-hidden="true">⌁</span>项目详情</a></li>
                <li><a class="nav-link" href="#tasks" data-route="tasks"><span class="nav-icon" aria-hidden="true">✓</span>任务控制台</a></li>
                <li><a class="nav-link" href="#gantt" data-route="gantt"><span class="nav-icon" aria-hidden="true">—</span>甘特排程</a></li>
              </ul>
            </section>

            <section class="nav-group" aria-labelledby="nav-quality">
              <h2 class="nav-label" id="nav-quality">质量</h2>
              <ul class="nav-list">
                <li><a class="nav-link" href="#requirements" data-route="requirements"><span class="nav-icon" aria-hidden="true">△</span>需求管线</a></li>
                <li><a class="nav-link" href="#defects" data-route="defects"><span class="nav-icon" aria-hidden="true">!</span>缺陷矩阵</a></li>
              </ul>
            </section>

            <section class="nav-group" aria-labelledby="nav-system">
              <h2 class="nav-label" id="nav-system">系统</h2>
              <ul class="nav-list">
                <li><a class="nav-link" href="#settings" data-route="settings"><span class="nav-icon" aria-hidden="true">⚙</span>设置中心</a></li>
              </ul>
            </section>
          </nav>
        </div>

        <div class="rail-footer">
          <div class="workspace-card">
            <div class="rail-card-copy">
              <span>Workspace / Project</span>
              <strong>Project OS Core</strong>
            </div>
          </div>
          <div class="user-card">
            <div class="user-avatar" aria-hidden="true">LO</div>
            <div class="rail-card-copy">
              <span>当前负责人</span>
              <strong>Local Owner</strong>
            </div>
          </div>
        </div>
      </aside>

      <main class="page-main" id="main-content" tabindex="-1">
        <div data-page-root></div>

          items: [['POS-081', 'Shell 实现', 5, ''], ['POS-083', '路由契约', 4, ''], ['POS-087', '视觉校准', 3, 'is-amber'], ['POS-092', '响应式', 3, ''], ['POS-094', '回归验证', 2, 'is-red']],

          items: [['Blocker', '1 · 发布阻塞', 5, 'is-red'], ['Critical', '1 · 核心路径', 4, 'is-red'], ['Major', '4 · 体验影响', 3, 'is-amber'], ['Minor', '5 · 局部问题', 2, ''], ['Trivial', '1 · 低影响', 1, '']],
          context: [['最高优先级', 'BUG-118'], ['影响版本', 'v1.2 RC1'], ['修复负责人', 'dev-agent']],
        },
        settings: {
          description: '配置外观、数据连接、MCP 与 Skills，不产生真实持久化。',
          action: '保存预览',
          stage: '系统配置工作区',
          stageMeta: '本地预览模式',
          metrics: [['外观方案', '01', '深色玻璃'], ['数据源', '03', '2 个可用'], ['MCP 服务', '04', '3 个在线'], ['Skills', '16', '12 个启用']],

        },
      }

      function elementFromHTML(markup) {
        const template = document.createElement('template')
        template.innerHTML = markup.trim()
        return template.content.firstElementChild
      }

      function renderMetricCards(metrics) {
        return metrics.map(([label, value, trend]) => `
          <article class="metric-card">
            <div class="metric-label">${label}</div>
            <div class="metric-row">
              <strong class="metric-value">${value}</strong>
              <span class="metric-trend">${trend}</span>
            </div>
          </article>
        `).join('')
      }

      function renderVisualItems(items) {
        return items.map(([name, detail, level, tone]) => `
          <div class="visual-item ${tone}" style="--level: ${level}">
            <strong>${name}</strong>
            <span>${detail}</span>
          </div>
        `).join('')
      }

      function renderContextRows(rows) {
        return rows.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')
      }

      function renderPageShell(route) {
        const data = pageShells[route]
        return elementFromHTML(`
          <section class="page-view" data-page="${route}" aria-labelledby="${route}-title">
            <header class="page-header">
              <div>
                <p class="page-kicker">Project OS / ${String(route).replace('-', ' ')}</p>
                <h1 id="${route}-title" tabindex="-1">${pageTitles[route]}</h1>
                <p class="page-description">${data.description}</p>
              </div>
              <div class="header-actions">
                <button class="secondary-action" type="button" data-prototype-action="筛选">筛选视图</button>
                <button class="primary-action" type="button" data-prototype-action="${data.action}">${data.action}</button>
              </div>
            </header>

            <div class="metric-grid" aria-label="关键指标">
              ${renderMetricCards(data.metrics)}
            </div>

            <section class="signature-stage" aria-labelledby="${route}-signature-title">
              <div class="signature-heading">
                <h2 id="${route}-signature-title">${data.stage}</h2>
                <span>${data.stageMeta}</span>
              </div>
              <div class="stage-scroll" tabindex="0" aria-label="${data.stage}可视化区域">
                <div class="signature-visual">
                  ${renderVisualItems(data.items)}
                </div>
              </div>
            </section>

            <div class="content-frame">
              <section class="glass-panel" aria-labelledby="${route}-workspace-title">
                <div class="panel-heading">
                  <div>
                    <h2 id="${route}-workspace-title">核心工作区</h2>
                    <p>后续任务将在此替换为可交互业务内容</p>
                  </div>
                  <div class="segmented" aria-label="预览范围">
                    <button type="button" aria-pressed="true">当前</button>
                    <button type="button" aria-pressed="false">全部</button>
                  </div>
                </div>
                <div class="empty-state">
                  <div>
                    <strong>${data.stage}已就位</strong>
                    页面业务数据与代表性交互将在后续实现任务中接入。
                  </div>
                </div>
              </section>

              <aside class="context-panel" aria-labelledby="${route}-context-title">
                <div class="panel-heading">
                  <h2 id="${route}-context-title">上下文摘要</h2>
                  <span class="status-badge ${route === 'defects' ? 'is-risk' : route === 'settings' ? '' : 'is-live'}">${route === 'settings' ? '预览' : '已同步'}</span>
                </div>
                <dl class="context-list">${renderContextRows(data.context)}</dl>
              </aside>
            </div>
          </section>
        `)
      }

      function renderDashboard() {
        return renderPageShell('dashboard')
      }

      function renderProjects() {
        return renderPageShell('projects')
      }

      function renderProjectDetail() {
        return renderPageShell('project-detail')
      }

      function renderActors() {
        return renderPageShell('actors')
      }

      function renderTasks() {
        return renderPageShell('tasks')
      }

      function renderGantt() {
        return renderPageShell('gantt')
      }

      function renderRequirements() {
        return renderPageShell('requirements')
      }

      function renderDefects() {
        return renderPageShell('defects')
      }

      function renderSettings() {
        return renderPageShell('settings')
      }

      function currentRoute() {
        const candidate = location.hash.replace(/^#\/?/, '')
        return routeOrder.includes(candidate) ? candidate : 'dashboard'
      }

      function renderCurrentPage({ focusHeading = false } = {}) {
        const route = currentRoute()

        document.querySelectorAll('[data-route]').forEach((link) => {
          const active = link.dataset.route === route
          link.classList.toggle('is-active', active)
          active ? link.setAttribute('aria-current', 'page') : link.removeAttribute('aria-current')
        })

        pageRoot.replaceChildren(pageRenderers[route]())
        document.title = `Project OS · ${pageTitles[route]}`

        if (focusHeading) pageRoot.querySelector('h1')?.focus()
      }

      function showToast(message) {
        toast.textContent = message
        toast.classList.add('is-visible')
        window.setTimeout(() => toast.classList.remove('is-visible'), 1900)
      }

      document.addEventListener('click', (event) => {
        const action = event.target.closest('[data-prototype-action]')
        if (action) showToast(`${action.dataset.prototypeAction}：预览模式，未写入数据`)
      })

      window.addEventListener('hashchange', () => renderCurrentPage({ focusHeading: true }))

      if (!location.hash) history.replaceState(null, '', '#dashboard')
      renderCurrentPage()
    </script>
  </body>
</html>
