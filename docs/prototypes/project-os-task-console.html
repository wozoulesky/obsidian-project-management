<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Project OS · 任务管理视觉原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030504;
      --surface: rgba(18, 22, 20, 0.74);
      --surface-raised: rgba(28, 33, 30, 0.82);
      --line: rgba(226, 240, 233, 0.16);
      --line-bright: rgba(245, 255, 250, 0.34);
      --text: #f3f7f4;
      --muted: #8d9791;
      --green: #37f58a;
      --green-deep: #10b965;
      --red: #ff5c61;
      --amber: #ffb45c;
      --radius-panel: 20px;
      --radius-card: 14px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.52);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--bg); }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 54% -8%, rgba(55, 245, 138, .075), transparent 34rem),
        radial-gradient(circle at 16% 88%, rgba(63, 91, 73, .1), transparent 28rem),
        linear-gradient(145deg, #090c0a 0%, var(--bg) 46%, #040605 100%);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      transform: translateY(-200%);
      background: var(--green);
      box-shadow: 0 0 24px rgba(55, 245, 138, .28);
      color: #031108;
      font-weight: 750;
      text-decoration: none;
    }

    .skip-link:focus { transform: translateY(0); }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(235, 245, 238, .024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(235, 245, 238, .024) 1px, transparent 1px),
        radial-gradient(ellipse at 57% 20%, rgba(55, 245, 138, .09), transparent 31rem);
      background-size: 42px 42px, 42px 42px, auto;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .84), transparent 92%);
      opacity: .76;
    }

    .console-shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 300px;
      min-height: 100vh;
      isolation: isolate;
    }

    .side-rail,
    .smart-panel {
      position: relative;
      min-width: 0;
      padding: 24px 18px;
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(118%);
      -webkit-backdrop-filter: blur(24px) saturate(118%);
    }

    .side-rail {
      border-right: 1px solid var(--line);
      box-shadow: inset -1px 0 rgba(255, 255, 255, .018), 18px 0 54px rgba(0, 0, 0, .22);
    }

    .side-rail::after,
    .smart-panel::before {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      content: "";
      pointer-events: none;
      background: linear-gradient(to bottom, var(--line-bright), transparent 32%, rgba(55, 245, 138, .09) 68%, transparent);
    }

    .side-rail::after { right: -1px; }

    .brand {
      position: relative;
      margin: 0 0 31px;
      padding-left: 19px;
      color: #fbfdfb;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand::before {
      position: absolute;
      top: 50%;
      left: 0;
      width: 8px;
      height: 8px;
      border: 1px solid rgba(224, 234, 227, .48);
      border-radius: 2px;
      content: "";
      transform: translateY(-50%) rotate(45deg);
      background: rgba(224, 234, 227, .72);
      box-shadow: 0 0 14px rgba(224, 234, 227, .18);
    }

    .nav-group {
      margin: 24px 10px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    nav a {
      position: relative;
      display: block;
      margin: 2px 0;
      padding: 9px 10px 9px 13px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      text-decoration: none;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    nav a::before {
      position: absolute;
      top: 50%;
      left: 0;
      width: 2px;
      height: 13px;
      border-radius: 2px;
      content: "";
      transform: translateY(-50%) scaleY(.2);
      background: transparent;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    nav a:hover {
      background: rgba(243, 247, 244, .035);
      color: var(--text);
      transform: translateX(2px);
    }

    nav a[aria-current="page"] {
      border-color: rgba(55, 245, 138, .15);
      background: linear-gradient(90deg, rgba(55, 245, 138, .105), rgba(19, 25, 21, .58));
      box-shadow: inset 0 1px rgba(255, 255, 255, .04);
      color: var(--green);
    }

    nav a[aria-current="page"]::before {
      transform: translateY(-50%) scaleY(1);
      background: var(--green);
      box-shadow: 0 0 12px rgba(55, 245, 138, .6);
    }

    .workspace-card {
      position: absolute;
      right: 18px;
      bottom: 24px;
      left: 18px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: linear-gradient(145deg, rgba(255, 255, 255, .045), transparent 58%), var(--surface-raised);
      box-shadow: inset 0 1px rgba(255, 255, 255, .075), 0 14px 36px rgba(0, 0, 0, .2);
    }

    .workspace-card::after {
      display: block;
      width: 64%;
      height: 2px;
      margin-top: 12px;
      border-radius: 2px;
      content: "";
      background: var(--green);
      box-shadow: 0 0 11px rgba(55, 245, 138, .32), 70px 0 0 rgba(216, 227, 220, .09);
    }

    .workspace-card small,
    .eyebrow,
    dt { color: var(--muted); }

    .workspace-card strong {
      display: block;
      margin: 3px 0 0;
      font-size: 13px;
      letter-spacing: .01em;
    }

    .workspace {
      min-width: 0;
      padding: 24px;
    }

    .topbar {
      display: flex;
      min-height: 40px;
      align-items: center;
      gap: 14px;
    }

    .topbar h1 {
      margin: 0 auto 0 0;
      font-size: clamp(20px, 1.7vw, 24px);
      font-weight: 720;
      letter-spacing: -.035em;
    }

    .topbar label {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .topbar label .eyebrow {
      font-size: 11px;
      letter-spacing: .08em;
    }

    .search {
      width: clamp(190px, 18vw, 240px);
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--surface);
      box-shadow: inset 0 1px rgba(255, 255, 255, .055), 0 10px 24px rgba(0, 0, 0, .18);
      color: var(--text);
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .search::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .search:hover,
    .search:focus {
      border-color: var(--line-bright);
      background: var(--surface-raised);
      box-shadow: inset 0 1px rgba(255, 255, 255, .07), 0 0 0 3px rgba(216, 227, 220, .045), 0 12px 30px rgba(0, 0, 0, .22);
    }

    .button {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--line-bright);
      border-radius: 9px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .045), transparent 72%), var(--surface-raised);
      box-shadow: inset 0 1px rgba(255, 255, 255, .09), 0 8px 20px rgba(0, 0, 0, .2);
      color: var(--text);
      font-weight: 620;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: var(--line-bright);
      box-shadow: inset 0 1px rgba(255, 255, 255, .12), 0 11px 25px rgba(0, 0, 0, .28);
    }

    .button:active { transform: translateY(0); }

    .button.primary {
      border-color: rgba(55, 245, 138, .84);
      background: linear-gradient(180deg, #53f89a, var(--green));
      box-shadow: inset 0 1px rgba(255, 255, 255, .32), 0 0 0 1px rgba(55, 245, 138, .1), 0 11px 28px rgba(55, 245, 138, .14);
      color: #031108;
      font-weight: 780;
    }

    .button.primary:hover {
      box-shadow: inset 0 1px rgba(255, 255, 255, .4), 0 0 0 1px rgba(55, 245, 138, .2), 0 13px 34px rgba(55, 245, 138, .24);
      filter: brightness(1.045);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .metric,
    .task-list,
    .task-fan,
    .timeline {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .032), transparent 34%),
        var(--surface);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .085),
        inset 0 -1px rgba(0, 0, 0, .34),
        var(--shadow),
        0 4px 12px rgba(0, 0, 0, .28);
      backdrop-filter: blur(22px) saturate(112%);
      -webkit-backdrop-filter: blur(22px) saturate(112%);
    }

    .metric::before,
    .task-list::before,
    .task-fan::before,
    .timeline::before {
      position: absolute;
      top: 0;
      right: 12%;
      left: 12%;
      height: 1px;
      content: "";
      pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--line-bright), transparent);
    }

    .metric {
      min-height: 78px;
      padding: 14px 15px 13px;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .metric:hover {
      transform: translateY(-2px);
      border-color: var(--line-bright);
      background: linear-gradient(135deg, rgba(255, 255, 255, .05), transparent 36%), var(--surface-raised);
    }

    .metric .eyebrow {
      font-size: 11px;
      letter-spacing: .045em;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      color: #fbfdfb;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace, monospace;
      font-size: 25px;
      font-variant-numeric: tabular-nums slashed-zero;
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1.2;
    }

    .task-stage {
      display: grid;
      grid-template-columns: minmax(238px, .7fr) minmax(360px, 1.3fr);
      gap: 16px;
      min-height: 354px;
    }

    @media (min-width: 1301px) {
      .task-stage { height: 354px; }

      .task-list {
        display: flex;
        min-height: 0;
        flex-direction: column;
      }

      .task-list ul {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-color: rgba(55, 245, 138, .34) transparent;
        scrollbar-gutter: stable;
      }
    }

    .task-list,
    .task-fan,
    .timeline { padding: 17px 18px; }

    .section-head {
      position: relative;
      z-index: 12;
      display: flex;
      min-height: 24px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 690;
      letter-spacing: -.012em;
    }

    .section-head .eyebrow {
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .segment-button {
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(243, 247, 244, .025);
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .segment-button:hover {
      border-color: var(--line-bright);
      color: var(--text);
    }

    .segment-button[aria-pressed="true"] {
      border-color: rgba(55, 245, 138, .56);
      background: rgba(55, 245, 138, .11);
      box-shadow: inset 0 1px rgba(255, 255, 255, .055), 0 0 18px rgba(55, 245, 138, .08);
      color: var(--green);
    }

    .scope-controls { margin: -1px 0 10px; }

    .range-controls {
      justify-content: flex-end;
      margin-left: auto;
    }

    .task-list ul,
    .timeline ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-list li {
      position: relative;
      padding: 0 0 0 9px;
      border-top: 1px solid var(--line);
    }

    .task-list li::before {
      position: absolute;
      top: 20px;
      left: 2px;
      width: 5px;
      height: 5px;
      border: 1px solid rgba(216, 227, 220, .32);
      border-radius: 50%;
      content: "";
      background: rgba(216, 227, 220, .1);
    }

    .task-list li:first-child { border-top: 0; }

    .task-row {
      display: block;
      width: 100%;
      padding: 11px 8px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
      transition: background 160ms ease, padding-left 160ms ease;
    }

    .task-row:hover {
      padding-left: 11px;
      background: linear-gradient(90deg, rgba(243, 247, 244, .035), transparent);
    }

    .task-list li.is-current {
      background: linear-gradient(90deg, rgba(55, 245, 138, .075), transparent 88%);
    }

    .task-list li.is-current::before {
      border-color: var(--green);
      background: var(--green);
      box-shadow: 0 0 10px rgba(55, 245, 138, .56);
    }

    .task-list li.is-current strong { color: var(--green); }

    .task-list li.is-overdue .task-due { color: var(--red); }

    .task-list strong {
      display: block;
      margin: 4px 0 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 630;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-list small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .task-row-top,
    .task-row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-row-top .task-code {
      font-size: 9px;
      letter-spacing: .08em;
    }

    .task-status {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    .task-status.is-complete { color: var(--green); }
    .task-status.is-overdue { color: var(--red); }

    .progress-track {
      display: block;
      height: 3px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(224, 234, 227, .09);
    }

    .progress-track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      box-shadow: 0 0 8px rgba(55, 245, 138, .28);
    }

    .task-fan {
      min-width: 0;
      background:
        radial-gradient(ellipse at 50% 72%, rgba(55, 245, 138, .055), transparent 40%),
        linear-gradient(135deg, rgba(255, 255, 255, .034), transparent 35%),
        var(--surface);
    }

    .fan-stack {
      --fan-gap: 58px;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      position: relative;
      min-height: 286px;
      perspective: 1100px;
      perspective-origin: 50% 46%;
      transform-style: preserve-3d;
    }

    .fan-stack::before {
      position: absolute;
      z-index: 0;
      right: 13%;
      bottom: 10px;
      left: 13%;
      height: 30px;
      border-radius: 50%;
      content: "";
      background: rgba(0, 0, 0, .62);
      filter: blur(15px);
      transform: rotateX(66deg);
    }

    .fan-card {
      position: absolute;
      top: 48%;
      left: 50%;
      z-index: 2;
      width: clamp(180px, 43%, 232px);
      min-height: 198px;
      padding: 49px 17px 17px;
      overflow: hidden;
      border: 1px solid var(--line-bright);
      border-radius: var(--radius-card);
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
      background:
        linear-gradient(128deg, rgba(255, 255, 255, .09), transparent 29%),
        linear-gradient(180deg, rgba(44, 50, 47, .88), transparent 74%),
        var(--surface-raised);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .17),
        inset -1px 0 rgba(255, 255, 255, .035),
        0 22px 34px rgba(0, 0, 0, .52),
        0 4px 8px rgba(0, 0, 0, .4);
      color: var(--text);
      text-align: left;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      --fan-span: calc(var(--count) - 1);
      --fan-position: calc(var(--index) - (var(--fan-span) / 2));
      --fan-y: calc((var(--index) - var(--count)) * 3px);
      --fan-z: calc((var(--count) - var(--index)) * 10px);
      --fan-scale: calc(1 - (var(--index) * .022));
      z-index: calc(var(--count) - var(--index) + 2);
      transform:
        translate(-50%, -50%)
        translate3d(calc(var(--fan-position) * var(--fan-gap)), var(--fan-y), var(--fan-z))
        rotateX(var(--tilt-y))
        rotateY(calc((var(--fan-position) * -7deg) + var(--tilt-x)))
        rotateZ(calc(var(--fan-position) * 2.5deg))
        scale(var(--fan-scale));
      transition: transform 260ms cubic-bezier(.2, .75, .2, 1), border-color 200ms ease, box-shadow 200ms ease, filter 200ms ease;
    }

    .fan-card::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 20px;
      height: 20px;
      border-bottom: 1px solid rgba(230, 237, 232, .2);
      border-left: 1px solid rgba(230, 237, 232, .2);
      content: "";
      background: linear-gradient(225deg, rgba(255, 255, 255, .14), rgba(7, 9, 8, .7) 54%);
      box-shadow: -4px 4px 10px rgba(0, 0, 0, .3);
    }

    .fan-card::after {
      position: absolute;
      z-index: 0;
      top: 74px;
      right: 17px;
      bottom: 18px;
      left: 17px;
      content: "";
      opacity: .58;
      background:
        linear-gradient(90deg, rgba(224, 234, 227, .2) 0 54%, transparent 54%) 0 0 / 100% 1px no-repeat,
        linear-gradient(90deg, rgba(224, 234, 227, .12) 0 78%, transparent 78%) 0 29px / 100% 1px no-repeat,
        linear-gradient(90deg, rgba(224, 234, 227, .1) 0 64%, transparent 64%) 0 58px / 100% 1px no-repeat,
        linear-gradient(90deg, rgba(224, 234, 227, .08) 0 86%, transparent 86%) 0 87px / 100% 1px no-repeat;
    }

    .fan-stack:hover .fan-card.is-selected {
      --fan-y: calc(((var(--index) - var(--count)) * 3px) - 11px);
      --fan-z: calc(((var(--count) - var(--index)) * 10px) + 22px);
      --fan-scale: 1.035;
      border-color: rgba(55, 245, 138, .82);
      box-shadow: inset 0 1px rgba(255, 255, 255, .52), 0 0 0 1px rgba(55, 245, 138, .24), 0 0 52px rgba(55, 245, 138, .38), 0 28px 44px rgba(0, 0, 0, .58);
    }

    .fan-card.is-selected {
      --fan-y: calc(((var(--index) - var(--count)) * 3px) - 8px);
      --fan-z: calc(((var(--count) - var(--index)) * 10px) + 18px);
      --fan-scale: 1.025;
      z-index: calc(var(--count) + 2);
      border-color: rgba(55, 245, 138, .66);
      background:
        linear-gradient(132deg, rgba(255, 255, 255, .42), transparent 31%),
        linear-gradient(155deg, rgba(55, 245, 138, .96) 0%, rgba(55, 245, 138, .84) 58%, var(--green-deep) 118%);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .48),
        inset 0 0 38px rgba(255, 255, 255, .1),
        0 0 0 1px rgba(55, 245, 138, .22),
        0 0 42px rgba(55, 245, 138, .3),
        0 26px 42px rgba(0, 0, 0, .58);
      color: #031108;
    }

    .fan-card small {
      position: relative;
      z-index: 2;
      color: rgba(224, 234, 227, .68);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace, monospace;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .fan-card.is-selected small { color: rgba(3, 17, 8, .72); }

    .fan-card.is-selected::after {
      opacity: .46;
      filter: brightness(.36);
    }

    .fan-card h3 {
      position: relative;
      z-index: 2;
      max-width: 92%;
      margin: 9px 0 12px;
      font-size: 13px;
      font-weight: 680;
      line-height: 1.48;
      text-wrap: balance;
    }

    .fan-meta,
    .fan-due,
    .fan-progress {
      position: relative;
      z-index: 2;
      display: block;
      font-size: 10px;
      line-height: 1.55;
    }

    .fan-meta { font-weight: 700; }
    .fan-due,
    .fan-progress { color: rgba(224, 234, 227, .66); }
    .fan-card.is-selected .fan-due,
    .fan-card.is-selected .fan-progress { color: rgba(3, 17, 8, .68); }

    .timeline {
      min-height: 151px;
      margin-top: 16px;
      padding-bottom: 15px;
    }

    .timeline:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: -4px;
      box-shadow: inset 0 0 0 1px rgba(55, 245, 138, .24), var(--shadow);
    }

    .timeline ol {
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--timeline-count, 4), minmax(0, 1fr));
      gap: 0;
      padding-top: 4px;
    }

    .timeline ol[data-density="dense"] li {
      padding-inline: 8px;
      font-size: 10px;
    }

    .timeline ol::before {
      position: absolute;
      top: 30px;
      right: 6.5%;
      left: 6.5%;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, var(--line), var(--line-bright), var(--line));
    }

    .timeline li {
      position: relative;
      min-width: 0;
      padding: 0 12px 8px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .timeline li:first-child { border-left: 0; }

    .timeline li::before {
      display: block;
      width: calc(100% - 10px);
      height: 8px;
      margin: 9px 0 13px;
      border: 1px solid var(--line-bright);
      border-radius: 5px;
      content: "";
      background: linear-gradient(180deg, rgba(224, 234, 227, .48), rgba(139, 154, 144, .22));

    }

    .timeline li.is-active::before {

    .timeline li.is-today::after {
      position: absolute;
      z-index: 4;
      top: -8px;
      bottom: -13px;
      left: 10px;
      width: 1px;
      content: "";
      background: var(--green);
      box-shadow: 0 0 8px 1px rgba(55, 245, 138, .72), 0 0 22px rgba(55, 245, 138, .42);
    }

    .timeline time {
      display: block;
      color: rgba(224, 234, 227, .65);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace, monospace;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .timeline .is-today time { color: var(--green); }

    .empty-state {
      display: grid;
      min-height: 96px;
      place-items: center;
      padding: 18px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .task-list li.empty-state {
      border: 0;
      background: transparent;
    }

    .task-list li.empty-state::before,
    .timeline li.empty-state::before,
    .timeline li.empty-state::after { display: none; }

    .fan-empty { min-height: 244px; }

    .timeline li.empty-state {
      grid-column: 1 / -1;
      border: 0;
    }

    .smart-panel {
      border-left: 1px solid var(--line-bright);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .045), transparent 30%),
        var(--surface-raised);
      box-shadow: inset 1px 0 rgba(255, 255, 255, .035), -22px 0 70px rgba(0, 0, 0, .32), var(--shadow);
    }

    .smart-panel::before { left: -1px; }

    .smart-panel::after {
      position: absolute;
      top: 0;
      right: 14%;
      left: 14%;
      height: 1px;
      content: "";
      pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--line-bright), transparent);
    }

    .smart-panel h2 {
      margin: 8px 0 10px;
      font-size: 20px;
      font-weight: 720;
      letter-spacing: -.035em;
      line-height: 1.34;
      text-wrap: balance;
    }

    .task-code {
      color: var(--green);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace, monospace;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: .12em;
      text-shadow: 0 0 14px rgba(55, 245, 138, .24);
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    .facts div {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: inset 0 1px rgba(255, 255, 255, .045);
    }

    dt {
      font-size: 10px;
      letter-spacing: .06em;
    }

    dd {
      margin: 3px 0 0;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .ai-advice {
      position: relative;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: linear-gradient(135deg, rgba(255, 255, 255, .04), transparent 42%), var(--surface);
      box-shadow: inset 0 1px rgba(255, 255, 255, .055), 0 12px 30px rgba(0, 0, 0, .16);
    }

    .ai-advice::after {
      position: absolute;
      top: -42px;
      right: -26px;
      width: 105px;
      height: 105px;
      border: 1px solid rgba(216, 227, 220, .08);
      border-radius: 50%;
      content: "";
      box-shadow: inset 0 0 30px rgba(216, 227, 220, .025);
    }

    .ai-advice h3 {
      position: relative;
      z-index: 1;

      font-size: 14px;
    }

    .ai-advice p {
      position: relative;

      font-size: 11px;

    }

    .panel-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 18px;
    }

    .panel-actions .button { padding-inline: 8px; }

    .button:disabled {
      cursor: not-allowed;
      filter: saturate(.5);
      opacity: .58;
      transform: none;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .tag {
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(243, 247, 244, .025);
      color: var(--muted);
      font-size: 10px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 30;
      max-width: min(320px, calc(100vw - 48px));
      padding: 10px 14px;
      border: 1px solid var(--line-bright);
      border-radius: var(--radius-card);
      background: var(--surface-raised);
      box-shadow: inset 0 1px rgba(255, 255, 255, .055), var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--muted);
      font-size: 11px;
    }

    .toast[hidden] { display: none; }

    :focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    @media (min-width: 1301px) {
      .fan-stack { --fan-gap: 78px; }

      .fan-stack .fan-card {
        width: 136px;
        padding-inline: 12px;
      }
    }

    @media (max-width: 1300px) {
      .workspace { padding-inline: 20px; }
      .task-stage { grid-template-columns: minmax(0, 1fr); }
      .task-fan { min-height: 340px; }
      .fan-stack { --fan-gap: 80px; }
      .fan-card { width: 136px; }
    }

    @media (max-width: 1179px) {
      .console-shell { grid-template-columns: 190px minmax(0, 1fr); }
      .side-rail { grid-row: 1; }
      .workspace { grid-column: 2; grid-row: 1; }
      .smart-panel {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr) minmax(0, 1fr);
        gap: 18px;
        border-top: 1px solid var(--line);
        border-left: 0;
      }
      .smart-panel > * { min-width: 0; }
      .smart-panel > .task-code,
      .smart-panel > h2,
      .smart-panel > .description { grid-column: 1; }
      .smart-panel > .facts { grid-column: 2; grid-row: 1 / span 3; margin: 0; }
      .smart-panel > .ai-advice { grid-column: 3; grid-row: 1 / span 3; }
      .smart-panel > .panel-actions { grid-column: 3; grid-row: 4; }
    }

    @media (max-width: 852px) {
      .console-shell { display: block; }
      .side-rail { padding: 16px; }
      .brand { margin-bottom: 13px; }
      .side-rail nav { display: flex; flex-wrap: wrap; gap: 4px; }
      .side-rail nav a { padding: 7px 9px; }
      .nav-group, .workspace-card { display: none; }
      .workspace { padding: 18px 16px; }
      .topbar { flex-wrap: wrap; }
      .topbar h1 { flex-basis: 100%; }
      .topbar label { flex: 1; }
      .search { width: 100%; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .task-stage { grid-template-columns: minmax(0, 1fr); }
      .smart-panel { display: block; }
      .smart-panel > .facts { margin: 20px 0; }
      .smart-panel > .panel-actions { display: grid; }
    }

    @media (max-width: 520px) {
      .topbar label .eyebrow { display: none; }
      .topbar > .button { width: 100%; }
      .timeline .section-head { flex-wrap: wrap; }
      .timeline .range-controls {
        flex-basis: 100%;
        justify-content: flex-start;
        margin-left: 0;
      }
      .timeline { overflow-x: auto; }
      .timeline ol { min-width: 560px; }
    }

    @media (max-width: 600px) {
      .fan-stack {
        display: grid;
        grid-auto-columns: minmax(168px, 76%);
        grid-auto-flow: column;
        gap: 12px;
        min-height: 244px;
        padding: 7px 4px 14px;
        overflow-x: auto;
        overflow-y: hidden;
        perspective: none;
        scroll-snap-type: x mandatory;
        scrollbar-color: rgba(55, 245, 138, .34) transparent;
      }

      .fan-stack::before { display: none; }

      .fan-card,
      .fan-card:nth-child(n),
      .fan-stack:hover .fan-card.is-selected {
        position: relative;
        top: auto;
        left: auto;
        z-index: auto;
        width: auto;
        min-height: 214px;
        padding: 42px 14px 14px;
        transform: none !important;
        filter: none;
        scroll-snap-align: center;
      }
    }

    @media (max-width: 380px) {
      .fan-card { width: 140px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }

      nav a:hover,
      .button:hover,
      .button:active,
      .metric:hover { transform: none !important; }

      .fan-stack {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-flow: row;
        gap: 8px;
        padding: 0;
        overflow: visible;
        perspective: none;
        scroll-snap-type: none;
      }

      .fan-stack::before { display: none; }

      .fan-card,
      .fan-card:nth-child(n),
      .fan-stack:hover .fan-card.is-selected {
        position: relative;
        top: auto;
        left: auto;
        width: auto;
        min-height: 132px;
        padding: 36px 12px 12px;
        transform: none !important;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="ambient" aria-hidden="true"></div>
  <div class="console-shell">
    <aside class="side-rail" aria-label="主导航">
      <p class="brand">Project OS</p>
      <nav>
        <a href="#">仪表盘</a>

      <section class="metrics" aria-label="任务指标" data-metrics></section>

      <section class="task-stage" aria-label="任务工作区">
        <article class="task-list">
          <div class="section-head"><h2>任务清单</h2><span class="eyebrow" data-visible-count aria-live="polite"></span></div>
          <div class="segmented scope-controls" role="group" aria-label="任务范围">
            <button class="segment-button" type="button" data-scope="all" aria-pressed="true">全部</button>
            <button class="segment-button" type="button" data-scope="mine" aria-pressed="false">我的</button>
            <button class="segment-button" type="button" data-scope="joined" aria-pressed="false">参与</button>

        <article class="task-fan">

      <section class="timeline" aria-labelledby="timeline-title" tabindex="0">

          <h2 id="timeline-title">交付时间线</h2>
          <span class="eyebrow" data-range-label aria-live="polite"></span>
          <div class="segmented range-controls" role="group" aria-label="时间范围">
            <button class="segment-button" type="button" data-range="week" aria-pressed="true">周</button>
            <button class="segment-button" type="button" data-range="month" aria-pressed="false">月</button>
            <button class="segment-button" type="button" data-range="quarter" aria-pressed="false">季度</button>

        <ol data-timeline-list></ol>

    </main>

    <aside class="smart-panel" aria-label="智能详情">
      <span class="task-code" data-detail-code></span>
      <h2 data-detail-title></h2>

      <dl class="facts">
        <div><dt>负责人</dt><dd data-detail-owner></dd></div>
        <div><dt>项目</dt><dd data-detail-project></dd></div>

        <div><dt>状态</dt><dd data-detail-status tabindex="-1"></dd></div>

      <div class="panel-actions">

        <button class="button primary" type="button" data-action="complete">标记完成</button>
      </div>

  </div>
  <div class="toast" role="status" aria-live="polite" hidden></div>
  <script>
    const tasks = [
      {
        id: 'task-001',
        code: 'POS-2026-081',
        title: '统一任务工作台视觉规范',
        description: '完成任务中心的信息层级、状态语言与组件验收。',
        owner: 'Lin',
        project: 'Project OS v1.2',
        due: '2026-08-06 18:00',
        status: '进行中',
        priority: '高',
        progress: 72,
        scope: ['all', 'mine'],
        tags: ['设计系统', '关键路径']
      },
      {
        id: 'task-002',
        code: 'POS-2026-082',
        title: 'MCP 接入验收',
        description: '核对本地 MCP 工具清单、权限边界与异常回退路径。',
        owner: 'Mei',
        project: 'Project OS v1.2',
        due: '2026-08-07 16:00',
        status: '待处理',
        priority: '高',
        progress: 28,
        scope: ['all', 'joined'],
        tags: ['集成', '验收']
      },
      {
        id: 'task-003',
        code: 'OPS-2026-043',
        title: '备份恢复演练',
        description: '在隔离环境复核备份完整性并记录恢复时间目标。',
        owner: 'Lin',
        project: '基础设施韧性',
        due: '2026-08-01 12:00',
        status: '逾期',
        priority: '高',
        progress: 44,
        scope: ['all', 'mine'],
        tags: ['可靠性', '演练']
      },
      {
        id: 'task-004',
        code: 'UX-2026-119',
        title: '移动端布局验证',
        description: '验证窄屏断点、触控目标和横向时间线的可用性。',
        owner: 'Qiao',
        project: '体验质量',
        due: '2026-08-10 15:30',
        status: '进行中',
        priority: '中',
        progress: 65,
        scope: ['all', 'joined'],
        tags: ['移动端', '无障碍']
      },
      {
        id: 'task-005',
        code: 'PRD-2026-067',
        title: '需求评审闭环',
        description: '归档评审结论并确认所有决策项均有负责人和截止时间。',
        owner: 'Lin',
        project: '需求治理',
        due: '2026-08-03 11:00',
        status: '已完成',
        priority: '中',
        progress: 100,
        scope: ['all', 'mine', 'joined'],
        tags: ['评审', '决策记录']
      },
      {
        id: 'task-006',
        code: 'REL-2026-031',
        title: '发布检查清单',
        description: '补齐上线前验证项、责任人签核和故障回滚入口。',
        owner: 'Yun',
        project: 'Release Train',
        due: '2026-08-14 19:00',
        status: '待处理',
        priority: '低',
        progress: 12,
        scope: ['all', 'joined'],
        tags: ['发布', '检查清单']
      }
    ];

    const DEMO_REFERENCE_DATE = '2026-08-01';
    let activeScope = 'all';
    let selectedId = 'task-001';
    let activeRange = 'week';
    let toastTimer;
    let inputModality = 'pointer';
    let fanFrame = null;
    let pendingFanPoint = null;

    const metricsNode = document.querySelector('[data-metrics]');
    const taskListNode = document.querySelector('[data-task-list]');
    const fanStage = document.querySelector('[data-fan-stage]');
    const timelineNode = document.querySelector('[data-timeline-list]');
    const toastNode = document.querySelector('.toast');
    const reducedMotionQuery = typeof window.matchMedia === 'function'
      ? window.matchMedia('(prefers-reduced-motion: reduce)')
      : null;
    const finePointerQuery = typeof window.matchMedia === 'function'
      ? window.matchMedia('(pointer: fine)')
      : null;

    function visibleTasks() {
      return tasks.filter((task) => task.scope.includes(activeScope));
    }

    function selectedTask() {
      if (!selectedId) return null;
      return visibleTasks().find((task) => task.id === selectedId) || null;
    }

    function normalizeSelection() {
      const visible = visibleTasks();
      if (!visible.some((task) => task.id === selectedId)) {
        selectedId = visible[0]?.id || null;
      }
    }

    function parseDateOnly(value) {
      const [year, month, day] = value.slice(0, 10).split('-').map(Number);
      return new Date(Date.UTC(year, month - 1, day));
    }

    function formatDateOnly(date) {
      return date.toISOString().slice(0, 10);
    }

    function timelineRangeConfig() {
      const reference = parseDateOnly(DEMO_REFERENCE_DATE);
      const year = reference.getUTCFullYear();
      const month = reference.getUTCMonth();
      let start;
      let end;
      let label;
      let density;

      if (activeRange === 'week') {
        start = new Date(reference);
        start.setUTCDate(start.getUTCDate() - ((start.getUTCDay() + 6) % 7));
        end = new Date(start);
        end.setUTCDate(end.getUTCDate() + 6);
        label = '本周 ' + formatDateOnly(start).slice(5).replace('-', '/') + '–' + formatDateOnly(end).slice(5).replace('-', '/');
        density = 'compact';
      } else if (activeRange === 'month') {
        start = new Date(Date.UTC(year, month, 1));
        end = new Date(Date.UTC(year, month + 1, 0));
        label = year + ' 年 ' + (month + 1) + ' 月';
        density = 'regular';
      } else {
        const quarterStartMonth = Math.floor(month / 3) * 3;
        start = new Date(Date.UTC(year, quarterStartMonth, 1));
        end = new Date(Date.UTC(year, quarterStartMonth + 3, 0));
        label = year + ' Q' + (Math.floor(month / 3) + 1);
        density = 'dense';
      }

      return { start, end, label, density };
    }

    function makeElement(tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function statusClass(task) {
      if (task.status === '已完成') return 'is-complete';
      if (task.status === '逾期') return 'is-overdue';
      return '';
    }

    function renderMetrics() {
      const visible = visibleTasks();
      const average = visible.length
        ? Math.round(visible.reduce((sum, task) => sum + task.progress, 0) / visible.length)
        : 0;
      const metrics = [
        ['可见任务', String(visible.length).padStart(2, '0')],
        ['进行中', String(visible.filter((task) => task.status === '进行中').length).padStart(2, '0')],
        ['高优先级', String(visible.filter((task) => task.priority === '高').length).padStart(2, '0')],
        ['平均进度', average + '%']
      ];
      const fragment = document.createDocumentFragment();
      metrics.forEach(([label, value]) => {
        const metric = makeElement('article', 'metric');
        metric.append(makeElement('span', 'eyebrow', label), makeElement('strong', '', value));
        fragment.append(metric);
      });
      metricsNode.replaceChildren(fragment);
    }

    function renderTaskList() {
      const visible = visibleTasks();
      document.querySelector('[data-visible-count]').textContent = visible.length + ' 项';
      document.querySelectorAll('[data-scope]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.scope === activeScope));
      });

      const fragment = document.createDocumentFragment();
      if (!visible.length) {
        const empty = makeElement('li', 'empty-state', '当前范围暂无任务');
        empty.setAttribute('role', 'status');
        fragment.append(empty);
      }
      visible.forEach((task) => {
        const item = makeElement('li', [
          task.id === selectedId ? 'is-current' : '',
          task.status === '逾期' ? 'is-overdue' : ''
        ].filter(Boolean).join(' '));
        const button = makeElement('button', 'task-row');
        button.type = 'button';
        button.dataset.taskId = task.id;
        button.setAttribute('aria-pressed', String(task.id === selectedId));
        button.setAttribute('aria-label', task.code + ' ' + task.title + '，' + task.status + '，截止 ' + task.due + '，进度 ' + task.progress + '%');

        const top = makeElement('span', 'task-row-top');
        const state = makeElement('span', 'task-status ' + statusClass(task), task.status + ' · ' + task.priority);
        top.append(makeElement('span', 'task-code', task.code), state);
        const meta = makeElement('small', 'task-row-meta');
        meta.append(makeElement('span', 'task-due', task.due), makeElement('span', '', '· ' + task.progress + '%'));
        const progress = makeElement('span', 'progress-track');
        progress.setAttribute('aria-hidden', 'true');
        const progressValue = makeElement('span');
        progressValue.style.width = task.progress + '%';
        progress.append(progressValue);
        button.append(top, makeElement('strong', '', task.title), meta, progress);
        item.append(button);
        fragment.append(item);
      });
      taskListNode.replaceChildren(fragment);
    }

    function renderFan() {
      const visible = visibleTasks();
      const fragment = document.createDocumentFragment();
      if (!visible.length) {
        const empty = makeElement('p', 'empty-state fan-empty', '当前范围暂无可展示任务');
        empty.setAttribute('role', 'status');
        fragment.append(empty);
      }
      visible.forEach((task, index) => {
        const selected = task.id === selectedId;
        const card = makeElement('button', 'fan-card' + (selected ? ' is-selected' : ''));
        card.type = 'button';
        card.dataset.taskId = task.id;
        card.setAttribute('aria-pressed', String(selected));
        card.setAttribute('aria-label', task.code + ' ' + task.title + '，' + task.status + '，截止 ' + task.due + '，进度 ' + task.progress + '%');
        card.style.setProperty('--index', index);
        card.style.setProperty('--count', visible.length);
        card.append(
          makeElement('small', '', task.priority + '优先 · ' + task.code),
          makeElement('h3', '', task.title),
          makeElement('span', 'fan-meta', task.status),
          makeElement('span', 'fan-due', '截止 ' + task.due),
          makeElement('span', 'fan-progress', '进度 ' + task.progress + '%')
        );
        fragment.append(card);
      });
      fanStage.replaceChildren(fragment);
    }

    function renderDetails() {
      const task = selectedTask();
      const tagsNode = document.querySelector('[data-detail-tags]');
      const editButton = document.querySelector('[data-action="edit"]');
      const completeButton = document.querySelector('[data-action="complete"]');

      if (!task) {
        document.querySelector('[data-detail-code]').textContent = 'NO TASK';
        document.querySelector('[data-detail-title]').textContent = '暂无可显示任务';
        document.querySelector('[data-detail-description]').textContent = '当前范围没有任务，请切换任务范围。';
        document.querySelector('[data-detail-owner]').textContent = '—';
        document.querySelector('[data-detail-project]').textContent = '—';
        document.querySelector('[data-detail-priority]').textContent = '—';
        document.querySelector('[data-detail-status]').textContent = '无任务';
        document.querySelector('[data-detail-due]').textContent = '—';
        document.querySelector('[data-detail-progress]').textContent = '—';
        tagsNode.replaceChildren();
        document.querySelector('[data-advice-title]').textContent = '切换任务范围';
        document.querySelector('[data-advice-text]').textContent = '选择包含任务的范围后，可继续查看详情与建议。';
        editButton.disabled = true;
        completeButton.disabled = true;
        completeButton.textContent = '标记完成';
        return;
      }

      document.querySelector('[data-detail-code]').textContent = task.code;
      document.querySelector('[data-detail-title]').textContent = task.title;
      document.querySelector('[data-detail-description]').textContent = task.description;
      document.querySelector('[data-detail-owner]').textContent = task.owner;
      document.querySelector('[data-detail-project]').textContent = task.project;
      document.querySelector('[data-detail-priority]').textContent = task.priority;
      document.querySelector('[data-detail-status]').textContent = task.status;
      document.querySelector('[data-detail-due]').textContent = task.due;
      document.querySelector('[data-detail-progress]').textContent = task.progress + '%';

      const tags = document.createDocumentFragment();
      task.tags.forEach((tag) => tags.append(makeElement('span', 'tag', tag)));
      tagsNode.replaceChildren(tags);

      let adviceTitle = '按当前节奏继续推进';
      let adviceText = '建议围绕下一验收点同步进度，并保持依赖与风险信息可见。';
      if (task.status === '已完成') {
        adviceTitle = '归档成果与复盘要点';
        adviceText = '任务已完成。建议补充验收证据，并将可复用经验同步到项目知识库。';
      } else if (task.status === '逾期') {
        adviceTitle = '先解除阻塞并重排截止时间';
        adviceText = '当前任务已逾期。建议确认阻塞责任人、恢复路径和新的可承诺时间。';
      } else if (task.priority === '高') {
        adviceTitle = '优先锁定关键验收点';
        adviceText = '这是高优先级任务。建议先确认验收证据与依赖边界，再集中推进剩余工作。';
      }
      document.querySelector('[data-advice-title]').textContent = adviceTitle;
      document.querySelector('[data-advice-text]').textContent = adviceText;

      editButton.disabled = false;
      completeButton.disabled = task.status === '已完成';
      completeButton.textContent = task.status === '已完成' ? '已完成' : '标记完成';
    }

    function renderTimeline() {
      const config = timelineRangeConfig();
      const entries = visibleTasks()
        .filter((task) => {
          const date = parseDateOnly(task.due);
          return date >= config.start && date <= config.end;
        })
        .slice()
        .sort((a, b) => a.due.localeCompare(b.due));
      document.querySelector('[data-range-label]').textContent = config.label + ' · ' + entries.length + ' 个节点';
      document.querySelectorAll('[data-range]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.range === activeRange));
      });
      timelineNode.style.setProperty('--timeline-count', Math.max(entries.length, 1));
      timelineNode.dataset.density = config.density;

      const fragment = document.createDocumentFragment();
      if (!entries.length) {
        const empty = makeElement('li', 'empty-state', '当前时间范围暂无交付节点');
        empty.setAttribute('role', 'status');
        fragment.append(empty);
      }
      entries.forEach((task) => {
        const date = task.due.slice(0, 10);
        const item = makeElement('li', [
          task.id === selectedId ? 'is-active' : '',
          date === DEMO_REFERENCE_DATE ? 'is-today' : ''
        ].filter(Boolean).join(' '));
        let label = date.slice(5).replace('-', '/');
        if (activeRange === 'month') label = Number(date.slice(5, 7)) + ' 月 ' + Number(date.slice(8, 10)) + ' 日';
        if (activeRange === 'quarter') label = date.slice(0, 4) + ' Q' + (Math.floor((Number(date.slice(5, 7)) - 1) / 3) + 1) + ' · ' + date.slice(5).replace('-', '/');
        const time = makeElement('time', '', label);
        time.dateTime = date;
        item.append(time, document.createTextNode(task.title + ' · ' + task.status));
        fragment.append(item);
      });
      timelineNode.replaceChildren(fragment);
    }

    function renderAll() {
      normalizeSelection();
      renderMetrics();
      renderTaskList();
      renderFan();
      renderDetails();
      renderTimeline();
    }

    function restoreTaskFocus(surface, taskId, scrollPosition) {
      const root = surface === 'list' ? taskListNode : fanStage;
      root.scrollTop = scrollPosition.top;
      root.scrollLeft = scrollPosition.left;
      const replacement = Array.from(root.querySelectorAll('[data-task-id]'))
        .find((button) => button.dataset.taskId === taskId);
      if (!replacement) return;
      if (inputModality === 'keyboard') replacement.focus();
      else replacement.focus({ preventScroll: true });
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toastNode.textContent = message;
      toastNode.hidden = false;
      toastTimer = window.setTimeout(() => {
        toastNode.hidden = true;
      }, 2400);
    }

    document.addEventListener('keydown', () => {
      inputModality = 'keyboard';
    }, true);

    document.addEventListener('pointerdown', () => {
      inputModality = 'pointer';
    }, true);

    document.addEventListener('click', (event) => {
      const actionButton = event.target.closest('[data-action]');
      if (actionButton) {
        const task = selectedTask();
        if (actionButton.dataset.action === 'new') showToast('演示模式：新建任务功能未连接后端。');
        if (actionButton.dataset.action === 'edit' && task) showToast('演示模式：可编辑“' + task.title + '”。');
        if (actionButton.dataset.action === 'complete' && task) {
          if (task.status === '已完成') {
            showToast('该任务已经完成。');
          } else {
            task.status = '已完成';
            task.progress = 100;
            renderAll();
            document.querySelector('[data-detail-status]').focus({ preventScroll: true });
            showToast('已将“' + task.title + '”标记为完成。');
          }
        }
        return;
      }

      const scopeButton = event.target.closest('[data-scope]');
      if (scopeButton) {
        activeScope = scopeButton.dataset.scope;
        renderAll();
        return;
      }

      const rangeButton = event.target.closest('[data-range]');
      if (rangeButton) {
        activeRange = rangeButton.dataset.range;
        renderTimeline();
        return;
      }

      const taskButton = event.target.closest('[data-task-id]');
      if (taskButton) {
        const surface = taskButton.closest('[data-task-list]') ? 'list' : 'fan';
        const root = surface === 'list' ? taskListNode : fanStage;
        const scrollPosition = { top: root.scrollTop, left: root.scrollLeft };
        selectedId = taskButton.dataset.taskId;
        renderTaskList();
        renderFan();
        renderDetails();
        renderTimeline();
        restoreTaskFocus(surface, selectedId, scrollPosition);
      }
    });

    function cancelFanFrame() {
      if (fanFrame === null) return;
      if (typeof window.cancelAnimationFrame === 'function') window.cancelAnimationFrame(fanFrame);
      else window.clearTimeout(fanFrame);
      fanFrame = null;
    }

    function resetFanTilt() {
      cancelFanFrame();
      pendingFanPoint = null;
      fanStage.style.setProperty('--tilt-x', '0deg');
      fanStage.style.setProperty('--tilt-y', '0deg');
    }

    function applyFanTilt() {
      fanFrame = null;
      if (!pendingFanPoint) return;
      const rect = fanStage.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const x = ((pendingFanPoint.x - rect.left) / rect.width) - .5;
      const y = ((pendingFanPoint.y - rect.top) / rect.height) - .5;
      fanStage.style.setProperty('--tilt-x', (x * 2.4).toFixed(2) + 'deg');
      fanStage.style.setProperty('--tilt-y', (y * -2.4).toFixed(2) + 'deg');
    }

    function handleFanPointerMove(event) {
      if (event.pointerType && event.pointerType !== 'mouse') return;
      pendingFanPoint = { x: event.clientX, y: event.clientY };
      if (fanFrame !== null) return;
      fanFrame = typeof window.requestAnimationFrame === 'function'
        ? window.requestAnimationFrame(applyFanTilt)
        : window.setTimeout(applyFanTilt, 16);
    }

    function syncFanMotion() {
      fanStage.removeEventListener('pointermove', handleFanPointerMove);
      resetFanTilt();
      const motionAllowed = !reducedMotionQuery || !reducedMotionQuery.matches;
      const finePointer = finePointerQuery && finePointerQuery.matches;
      if (motionAllowed && finePointer) {
        fanStage.addEventListener('pointermove', handleFanPointerMove);
      }
    }

    fanStage.addEventListener('pointerleave', resetFanTilt);
    fanStage.addEventListener('pointercancel', resetFanTilt);
    fanStage.addEventListener('pointerup', resetFanTilt);
    if (reducedMotionQuery && typeof reducedMotionQuery.addEventListener === 'function') {
      reducedMotionQuery.addEventListener('change', syncFanMotion);
    }
    if (finePointerQuery && typeof finePointerQuery.addEventListener === 'function') {
      finePointerQuery.addEventListener('change', syncFanMotion);
    }
    syncFanMotion();
    renderAll();
  </script>
</body>
</html>
